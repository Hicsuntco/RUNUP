name: RunUp
options:
  bundleIdPrefix: com.hicsuntco.runup
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

targets:
  RunUp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunUp
        excludes:
          - "Resources/Fonts/*.md"
    resources:
      - path: RunUp/Resources/Fonts
      - path: RunUp/Resources/Assets.xcassets
      - path: RunUp/Resources/Localizable.xcstrings
      # Traduit les descriptions d'autorisation ci-dessous (`NS*UsageDescription`). Sans ce
      # catalogue, ces chaînes ne passent PAS par `Localizable.xcstrings` — elles vivent dans
      # l'Info.plist — et iOS affichait donc ses dialogues système en français à tout le monde,
      # au moment précis où l'on demande à quelqu'un l'accès à sa position, à son micro et à ses
      # données de santé. Ses clés sont les clés Info.plist elles-mêmes, pas les phrases.
      - path: RunUp/Resources/InfoPlist.xcstrings
      # Obligatoire depuis mai 2024 : sans ce fichier dans le bundle, App Store Connect refuse le
      # binaire à l'ENVOI (ITMS-91053), avant même toute revue humaine.
      - path: RunUp/Resources/PrivacyInfo.xcprivacy
    # Build settings that can't be committed with their real values (the coach's shared secret)
    # come from here — a committed file of empty defaults that optionally includes the gitignored
    # `Secrets.xcconfig` holding the actual values. See Config.xcconfig and IOS_SETUP.md
    # § "Coach backend".
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: RunUp/Info.plist
      properties:
        CFBundleDisplayName: RunUp
        # Shared app↔server secret for the coach proxy, substituted at build time from the
        # RUNUP_APP_SECRET build setting (Config.xcconfig → Secrets.xcconfig) instead of living as
        # a string literal in CoachService.swift, where it was committed in plain text. Read back
        # at runtime by `CoachService.appSecret` — see the comment there on why an embedded secret
        # is a deterrent against casual abuse, not a real boundary.
        RUNUPAppSecret: "$(RUNUP_APP_SECRET)"
        # Trilingue, et cette fois pour de vrai.
        #
        # Ces trois langues avaient été ramenées au seul français parce que la couverture
        # s'arrêtait là où l'app cessait d'afficher des littéraux : le moteur de plan composait
        # ses titres de séance en français puis les ÉCRIVAIT EN BASE, et une centaine d'autres
        # chaînes étaient construites à l'exécution en `String`, que SwiftUI ne localise pas.
        # Un téléphone anglais affichait donc un chrome traduit autour d'un programme français.
        #
        # Ce n'est plus le cas : chaque séance porte un `SessionKind` indépendant de la langue et
        # son texte est rédigé à l'affichage, ~400 chaînes composées passent par
        # `String(localized:)`, et le formatage des dates et des nombres suit `Locale.current`
        # au lieu d'un `fr_FR` figé.
        CFBundleLocalizations:
          - fr
          - en
          - es
        CFBundleShortVersionString: "2.5"
        CFBundleVersion: "14"
        # Synthesized launch storyboard (no custom .storyboard file) — a plain color is all it
        # can show (the real animated wordmark only runs once app code is live, see
        # `SplashView`), but this stops the default white flash before that even appears.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Lets ASWebAuthenticationSession capture Strava's OAuth redirect (see StravaService.swift)
        # — Strava's app settings must have this exact URI (runup://strava-callback) added as an
        # "Authorization Callback Domain"/redirect URI once she creates her Strava API application.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - runup
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait-only design (see DesignSystem/); without this, Apple's App Store validation
        # rejects the bundle for not supporting iPad Split View multitasking's full 4-orientation
        # set. This opts the app out of that requirement instead of adding rotation support.
        UIRequiresFullScreen: true
        NSHealthShareUsageDescription: "RunUp lit tes données Santé (fréquence cardiaque, nombre de pas, calories actives, sommeil) pour calculer ta forme du jour, adapter ton programme et suivre tes objectifs quotidiens."
        NSHealthUpdateUsageDescription: "RunUp enregistre tes séances de course dans Santé après chaque sortie."
        NSLocationWhenInUseUsageDescription: "RunUp utilise ta position pour suivre ta distance, ton allure et ton tracé pendant une course."
        NSMicrophoneUsageDescription: "RunUp utilise le micro pour t'écouter quand tu poses une question à voix haute à ton coach pendant une course."
        NSSpeechRecognitionUsageDescription: "RunUp transcrit ce que tu dis pour que ton coach puisse te répondre à voix haute pendant une course."
        # `location` only — the run tracker really does keep GPS alive with the screen off.
        # `remote-notification` used to be listed too, but the server only ever sends visible
        # alert pushes (lib/apns.js), which need no background mode, and no silent-push handler
        # exists — an unused background mode is an App Review 2.5.4 flag.
        UIBackgroundModes:
          - location
        # Lets `LiveRunViewModel` start a Live Activity (Lock Screen + Dynamic Island) for the
        # in-progress run — see `RunActivityAttributes` (Shared/) and `RunActivityWidget`
        # (RunUpWidgets/). `FrequentUpdates` avoids the system throttling `Activity.update` calls
        # down to roughly once a minute — a run updates its own Live Activity every 5s.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - DMSans-Light.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf
          - DMSans-Italic.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
    dependencies:
      - target: RunUpWidgets
        embed: true
      - target: RunUpWatch
        embed: true
    entitlements:
      path: RunUp/RunUp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Required (iOS 15+) for HKObserverQuery background delivery — what lets steps/calories
        # updates wake the app briefly so the widget refreshes without her opening the app.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
        # Shares today's goals/streak/theme with the Home Screen widget (`RunUpWidgets` target) —
        # the widget runs in its own process with no other way to reach `UserProfile`. Needs a real
        # App Group created under her Apple Developer account (Certificates, Identifiers & Profiles
        # → Identifiers → App Groups) before this entitlement can actually provision — Xcode's
        # automatic signing usually offers to create it inline the first time you add the "App
        # Groups" capability in Signing & Capabilities if it doesn't exist yet.
        com.apple.security.application-groups:
          - group.com.hicsuntco.runup
        # Lets a tapped referral link (https://runup-nu.vercel.app/r/CODE) open straight into the
        # app with the code prefilled instead of just a webpage — see
        # public/.well-known/apple-app-site-association (must stay in sync: same domain here as
        # `appIDs`/`components` there) and `ReferralLinkHandler.swift`. Apple only actually
        # verifies this once the app is signed with a real provisioning profile on a device/
        # TestFlight — the Simulator can still open the URL via `.onOpenURL` for testing, it just
        # won't have gone through the system's AASA verification step first.
        com.apple.developer.associated-domains:
          - applinks:runup-nu.vercel.app
        # Xcode's automatic signing rewrites this to "production" itself when archiving for
        # TestFlight/App Store (matched to the distribution provisioning profile) — "development"
        # here is what a Debug run from Xcode to a real device actually needs.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SW49TQ25NV
    # Un schéma PARTAGÉ, déclaré ici plutôt que laissé à l'auto-création.
    #
    # `xcodebuild archive` exige un schéma. Sans déclaration, Xcode en fabrique un à la volée à la
    # première ouverture du projet — invisible sur ta machine, mais fabriqué par une heuristique
    # sur laquelle on n'a aucune prise, et refabriqué à chaque `xcodegen generate` sur une machine
    # de CI qui, elle, part d'un dépôt sans `.xcodeproj`. Le déclarer, c'est garantir que la
    # commande d'archivage du workflow trouve toujours la même chose, et que `RunUpTests` est bien
    # attaché à l'action « Test » — sinon la CI construit sans jamais exécuter les tests de
    # confidentialité des itinéraires, ce qui est exactement le contraire du but.
    scheme:
      testTargets:
        - RunUpTests

  # Home Screen widget — shows the same single-ring 3-goal widget as `DailyGoalsBarsView`/streak,
  # fed by `DailyGoalsSnapshot` over the shared App Group rather than any live in-app state (a
  # widget extension is a separate process, restarted on its own schedule by the system — it can
  # never hold a live reference to `AppState`). Reuses `RunUp/Shared`'s `Color(hex:)`/`.darkened(_:)`
  # (pure, target-agnostic math) and the app's real brand fonts (bundled + declared below, same as
  # the main target), but not the rest of `RunUp/DesignSystem` — `RUColor`/`ThemeStore` are
  # in-memory singletons the app's process keeps live and this one can't, so
  # `WidgetAccentPalette.swift` mirrors just the handful of theme values needed.
  RunUpWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunUpWidgets
      - path: RunUp/Shared
        excludes:
          # `RouteGeometry` travaille sur des `RunRecord.RoutePoint`, et `RunRecord` vit dans
          # `RunUp/Models`, qui n'est PAS compilé dans cette extension — ce fichier y provoquait
          # donc une erreur « cannot find type 'RunRecord' in scope » depuis son introduction.
          # Le widget dessine des anneaux et des objectifs, jamais un parcours : l'exclure est la
          # bonne réponse, plutôt que de tirer tout le modèle de données dans l'extension.
          - "RouteGeometry.swift" 
    resources:
      - path: RunUp/Resources/Fonts
        excludes:
          - "*.md"
      # L'extension est signée et livrée séparément de l'app : le manifeste de l'app ne la couvre
      # pas, il lui faut le sien. Elle lit `DailyGoalsSnapshot` via UserDefaults du groupe partagé.
      - path: RunUpWidgets/PrivacyInfo.xcprivacy
    info:
      path: RunUpWidgets/Info.plist
      properties:
        CFBundleDisplayName: RunUp
        # App Store validation requires an extension's version to match its host app's — keep
        # these two in step with `RunUp`'s `CFBundleShortVersionString`/`CFBundleVersion` above.
        CFBundleShortVersionString: "2.5"
        CFBundleVersion: "14"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Only the 2 families this widget's redesign actually uses (Bebas Neue for the streak/ring
        # numerals, DM Sans Bold for labels) — no need to ship the whole main-app font set into a
        # second bundle.
        UIAppFonts:
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf
          - DMSans-SemiBold.ttf
    entitlements:
      path: RunUpWidgets/RunUpWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hicsuntco.runup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SW49TQ25NV
        TARGETED_DEVICE_FAMILY: "1"

  # Apple Watch companion — a real standalone run tracker on the wrist: HKWorkoutSession +
  # HKLiveWorkoutBuilder (live wrist heart rate, distance, active calories — sensor data the
  # iPhone app alone never had), today's session pushed from the phone over WatchConnectivity,
  # and each finished run transferred back to the phone, which inserts the RunRecord and runs the
  # debrief/adaptive-plan mechanic (that engine stays phone-side on purpose). Reuses RunUp/Shared
  # (Color(hex:)/darkened — pure, target-agnostic) the same way RunUpWidgets does.
  RunUpWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: RunUpWatch
      # Only the hex/darken color math — the rest of Shared/ is widget/Live Activity plumbing
      # (RunActivityAttributes imports ActivityKit, which doesn't exist on watchOS).
      - path: RunUp/Shared/ColorHex.swift
      # La montre ne prend de `RunUp/Shared` que les fichiers dont elle a besoin, un par un —
      # le dossier entier y ferait entrer du code qui dépend de modèles absents de cette cible.
      - path: RunUp/Shared/DisplayFont.swift
    resources:
      - path: RunUpWatch/Assets.xcassets
      - path: RunUp/Resources/Fonts
        excludes:
          - "*.md"
      # Le MÊME catalogue de chaînes que l'app iPhone. Sans lui, la montre restait entièrement en
      # français quelle que soit la langue de l'utilisatrice — chaque `Text("…")` retombait sur sa
      # clé française faute de traduction à charger. Le partager plutôt que d'en créer un second
      # évite d'avoir à traduire deux fois les libellés communs (KM, TEMPS, KCAL, EN PAUSE…).
      - path: RunUp/Resources/Localizable.xcstrings
      # Catalogue distinct de celui de l'iPhone : la montre a ses propres textes d'autorisation
      # (« au poignet », « depuis la montre »), donc les mêmes clés y portent d'autres phrases.
      - path: RunUpWatch/InfoPlist.xcstrings
    info:
      path: RunUpWatch/Info.plist
      properties:
        CFBundleDisplayName: RunUp
        # Must track the iOS app's version pair exactly — App Store validation requires it.
        CFBundleShortVersionString: "2.5"
        CFBundleVersion: "14"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.hicsuntco.runup
        # Mêmes langues déclarées que l'app iPhone, sinon watchOS ne propose que le français.
        CFBundleLocalizations:
          - fr
          - en
          - es
        # Without the workout-processing background mode, watchOS suspends the app seconds after
        # the wrist drops — the HKWorkoutSession stops collecting mid-run.
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "RunUp lit ta fréquence cardiaque pendant la course pour l'afficher en direct au poignet."
        NSHealthUpdateUsageDescription: "RunUp enregistre ta course comme une vraie séance dans Santé — elle compte dans tes anneaux."
        NSLocationWhenInUseUsageDescription: "RunUp utilise ta position pour mesurer distance et allure pendant une course depuis la montre."
        UIAppFonts:
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf
          - DMSans-SemiBold.ttf
    entitlements:
      path: RunUpWatch/RunUpWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SW49TQ25NV
        TARGETED_DEVICE_FAMILY: "4"
        # Single 1024×1024 source icon, same as the RunUp target — Xcode generates every required
        # watch size at build/App Store processing time and auto-populates CFBundleIconName. Its
        # absence is exactly what the upload rejection (missing CFBundleIconName + "no icons found
        # for watch application") flagged.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # First test target in the project. Scoped deliberately at the ONE place where a silent
  # regression does real-world harm rather than chasing a coverage percentage: the plan engine
  # decides what a real person is told to run, and the audit found four progression defects there
  # (no deload weeks, a +115% long-run jump between blocks, an all-quality Spécifique block, an
  # uncapped tier inflating the taper). These tests encode the safety invariants those fixes
  # established, so a future refactor of the engine fails the build instead of quietly shipping an
  # injury-risk plan again.
  RunUpTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunUpTests
    dependencies:
      - target: RunUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup.tests
        GENERATE_INFOPLIST_FILE: YES
