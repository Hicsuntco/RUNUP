# De ce dépôt à TestFlight, sans passer par Xcode.
#
# Ce workflow fait ce que tu faisais à la main dans Xcode — générer le projet, le construire,
# le signer, l'envoyer à App Store Connect — sur une machine macOS louée à GitHub, à partir du
# code tel qu'il est commité. L'intérêt n'est pas le confort : c'est qu'un build livré aux
# testeurs corresponde exactement à un commit, et pas à l'état de ta machine ce jour-là.
#
# ─── CE QU'IL FAUT AVOIR CRÉÉ AVANT LE PREMIER LANCEMENT ────────────────────────────────────────
#
# Neuf secrets, dans Settings → Secrets and variables → Actions → New repository secret. Aucune de
# ces valeurs ne doit être écrite ailleurs que là : ni dans un fichier du dépôt, ni dans un
# message, ni dans une capture d'écran.
#
#   RUNUP_APP_SECRET          Le secret partagé avec `api/coach.js`, exactement la même chaîne que
#                             la variable du même nom côté Vercel. Sans lui, le coach répond 401
#                             dans le build — tout le reste marche, ce qui rend la panne difficile
#                             à voir.
#
#   APPLE_DIST_CERT_P12       Ton certificat de distribution Apple, exporté depuis Trousseaux
#                             d'accès (clic droit sur « Apple Distribution: … » → Exporter →
#                             format .p12), puis encodé en base64 :
#                                 base64 -i Certificats.p12 | pbcopy
#                             C'est le contenu encodé qui va dans le secret, pas le fichier.
#
#   APPLE_DIST_CERT_PASSWORD  Le mot de passe choisi pendant cet export.
#
#   ASC_KEY_ID                App Store Connect → Users and Access → Integrations → App Store
#   ASC_ISSUER_ID             Connect API → « + ». Rôle **Admin**, et pas « App Manager » : ce
#   ASC_KEY_P8                dernier laisse bien Xcode créer des profils de développement, donc
#                             l'archivage réussit, puis l'export se fait refuser la signature dans
#                             le nuage — « Cloud signing permission error », après un quart d'heure
#                             de machine. Le rôle d'une clé est figé à sa création : pour le
#                             corriger il faut révoquer la clé et en créer une autre.
#                             La page affiche le Key ID et l'Issuer ID, et propose UNE SEULE FOIS
#                             le téléchargement du fichier AuthKey_XXXXXXXXXX.p8 — Apple ne le
#                             redonne jamais. Encode-le pareil :
#                                 base64 -i AuthKey_XXXXXXXXXX.p8 | tr -d '\n' | gh secret set ASC_KEY_P8
#
#   (Les profils de provisionnement NE SONT PLUS des secrets : ils sont fabriqués à chaque
#   build par `ci_scripts/profils.py`, avec la clé d'API ci-dessus. Voir ce fichier pour le
#   pourquoi. APPLE_PROFILE_APP, APPLE_PROFILE_WIDGETS et APPLE_PROFILE_WATCH ne servent plus
#   à rien et peuvent être supprimés du dépôt.)
#
#   (ancienne procédure, conservée pour mémoire : developer.apple.com → Certificates,
#                             Identifiers & Profiles → Profiles → « + » → Distribution → App
#                             Store Connect, une fois par bundle ID. Télécharger les trois .mobileprovision et
#                             encode-les comme le reste. Ils expirent au bout d'un an.
#
# Le Team ID (SW49TQ25NV) n'est pas un secret : il est déjà dans `project.yml`, et les options
# d'export sont fabriquées à l'exécution à partir des profils eux-mêmes.
#
# ─── CE QUE ÇA COÛTE ────────────────────────────────────────────────────────────────────────────
#
# Sur un dépôt privé, GitHub facture les machines macOS DIX FOIS le tarif d'une machine Linux.
# D'où les deux garde-fous ci-dessous : les commits qui ne touchent qu'au serveur ou à la
# documentation ne déclenchent rien, et deux exécutions ne se chevauchent jamais.

name: TestFlight

on:
  # Le bouton : Actions → TestFlight → Run workflow. C'est par là que passe un envoi décidé,
  # y compris depuis le téléphone.
  workflow_dispatch:
    inputs:
      build_number:
        description: "Numéro de build à imposer (vide = 1000 + numéro d'exécution)"
        required: false
        type: string

  push:
    branches:
      - claude/runup-ios-swiftui-app-5b1yv6
    # Rien de ce qui suit ne peut changer le binaire iOS d'un octet : le déclencher pour un
    # correctif d'API ou une phrase de politique de confidentialité, ce serait payer une machine
    # macOS pour reconstruire à l'identique.
    paths-ignore:
      - "api/**"
      - "lib/**"
      - "db/**"
      - "public/**"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "**/*.md"
      # La chaîne App Store — créer la version, pousser la fiche, composer les captures, envoyer
      # en revue — ne rentre dans aucun binaire. La modifier déclenchait pourtant une compilation
      # macOS de dix minutes et, pire, un NOUVEAU numéro de build : au moment de choisir laquelle
      # attacher à la version, deux builds au code identique se ressemblent trop pour qu'on les
      # distingue. `check_listing.py` et `check_fonts.py` ne sont pas là : le workflow les exécute.
      - "ci_scripts/asc.py"
      - "ci_scripts/screenshots.py"
      - ".github/workflows/appstore.yml"
      # Éteindre Xcode Cloud ne touche pas au binaire non plus.
      - ".github/workflows/xcode-cloud.yml"
      - "appstore/**"
      - "privacy.html"
      # La page d'assistance de la fiche App Store. Elle vivait sur `main` SEULEMENT — donc une
      # copie de cet arbre vers `main` la supprimait, et avec elle l'URL d'assistance qu'Apple
      # exige. Elle est maintenant des deux côtés ; cette ligne lui évite de payer une machine
      # macOS quand on y corrige une phrase.
      - "support.html"
      - "design_handoff_runup_app/**"
      # Les captures brutes, les accroches et le composeur qui les assemble : tout ce dossier
      # sert à FABRIQUER la fiche App Store, rien n'y entre dans le binaire. Déposer six photos
      # d'écran y payait une machine macOS pendant neuf minutes, pour reconstruire exactement la
      # même app — et surtout pour consommer un envoi du quota quotidien d'Apple, celui-là même
      # qui nous a bloqués une journée entière.
      - "appstore/**"

# Deux envois en parallèle produiraient deux builds et une course à qui arrive le premier chez
# Apple. `cancel-in-progress: false` : on laisse finir celui qui est déjà en train de signer
# plutôt que de le tuer au milieu.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      # Le Xcode par défaut de l'image n'est pas forcément le plus récent qu'elle contient, et ce
      # détail décide de l'issue : App Store Connect a REFUSÉ un IPA parfaitement signé parce
      # qu'il avait été construit avec le SDK iOS 18.5 de Xcode 16.4, alors qu'Apple exige
      # désormais le SDK iOS 26 ou plus. Le refus arrive à la toute dernière étape, après vingt
      # minutes de machine, et ne dit rien du fait que la machine avait un Xcode plus récent
      # sous la main.
      #
      # D'où : on choisit explicitement le plus récent, et on vérifie le SDK AVANT de compiler.
      - name: Choisir Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "→ Xcode retenu : $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          sdk=$(xcodebuild -showsdks | grep -Eo "iphoneos[0-9.]+" | sort -V | tail -1 | sed "s/iphoneos//")
          if [ -z "$sdk" ]; then
            echo "✗ Aucun SDK iOS trouvé — xcode-select a-t-il pointé sur une installation valide ?"
            xcodebuild -showsdks
            exit 1
          fi
          echo "→ SDK iOS le plus récent : $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo ""
            echo "✗ App Store Connect refuse tout binaire construit avec un SDK iOS antérieur à 26."
            echo "  Cette machine ne propose que le SDK $sdk. Il faut une image plus récente"
            echo "  (le champ runs-on du workflow)."
            exit 1
          fi

      # Les six secrets sont vérifiés ICI, avant tout le reste, parce qu'un secret absent ne se
      # présente pas comme un secret absent.
      #
      # Un `ASC_KEY_P8` vide a déjà produit ceci : le workflow écrit un fichier de zéro octet,
      # l'archivage démarre normalement, et `xcodebuild` répond quatre minutes plus tard
      # « Invalid authentication key credential (CryptoKitASN1Error.invalidPEMDocument) » — un
      # message qui parle de cryptographie pour dire « ce fichier est vide ». Entre-temps la
      # machine a compilé et exécuté toute la suite de tests, facturée dix fois le tarif normal.
      #
      # Rien ici n'affiche la moindre valeur : seulement des noms et un verdict.
      - name: Vérifier les secrets
        env:
          RUNUP_APP_SECRET: ${{ secrets.RUNUP_APP_SECRET }}
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in RUNUP_APP_SECRET APPLE_DIST_CERT_P12 APPLE_DIST_CERT_PASSWORD \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "✗ $name — absent ou vide"
              missing=1
            else
              echo "✓ $name"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Settings → Secrets and variables → Actions."
            echo "Voir IOS_SETUP.md § « Envoyer un build sur TestFlight » pour l'origine de chacun."
            exit 1
          fi

          # Deux secrets sont des fichiers encodés en base64. Un encodage raté produit une chaîne
          # non vide qui passe le test ci-dessus et casse bien plus loin — on décode donc pour de
          # bon, et on regarde si ce qui sort ressemble à ce que ça doit être.
          if ! echo "$ASC_KEY_P8" | base64 -d 2>/dev/null | head -1 | grep -q "BEGIN PRIVATE KEY"; then
            echo ""
            echo "✗ ASC_KEY_P8 ne redonne pas une clé PEM une fois décodé."
            echo "  Le secret doit contenir le base64 du fichier AuthKey_XXXXXXXXXX.p8 :"
            echo "    base64 -i AuthKey_XXXXXXXXXX.p8 | tr -d '\\n' | gh secret set ASC_KEY_P8"
            exit 1
          fi
          echo "✓ ASC_KEY_P8 redonne bien une clé PEM"

          # Une archive PKCS#12 est du DER : elle commence toujours par 30 82 (une SEQUENCE).
          magic=$(echo "$APPLE_DIST_CERT_P12" | base64 -d 2>/dev/null | head -c 2 | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "3082" ]; then
            echo ""
            echo "✗ APPLE_DIST_CERT_P12 ne redonne pas une archive PKCS#12 une fois décodé."
            exit 1
          fi
          echo "✓ APPLE_DIST_CERT_P12 redonne bien une archive PKCS#12"


      - name: Installer XcodeGen
        run: brew install xcodegen

      # Le numéro de build doit croître à chaque envoi, et ne jamais retomber sous un numéro déjà
      # reçu par App Store Connect. `github.run_number` s'incrémente tout seul mais repart de 1 ;
      # or Xcode Cloud a déjà envoyé des builds numérotés autour de 14. D'où le décalage de 1000 :
      # cette chaîne-ci commence au-dessus de tout ce qui existe et ne peut plus la rattraper.
      #
      # Conséquence à connaître : après un envoi d'ici, un build Xcode Cloud (qui numérote 15, 16…)
      # sera refusé pour la même version. Les deux chaînes ne peuvent pas alterner ; il faut en
      # choisir une.
      - name: Calculer le numéro de build
        id: build
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            NUMBER="${{ inputs.build_number }}"
          else
            NUMBER=$(( 1000 + GITHUB_RUN_NUMBER ))
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Build $NUMBER"

      # Écrit Secrets.xcconfig, impose le numéro de build aux trois cibles, génère le .xcodeproj.
      # Exactement le même script que celui qu'exécute Xcode Cloud (`ci_post_clone.sh`), pour que
      # les deux chaînes ne puissent pas produire des binaires différents.
      - name: Préparer le projet
        env:
          RUNUP_APP_SECRET: ${{ secrets.RUNUP_APP_SECRET }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: sh ci_scripts/prepare_project.sh

      # `Font.custom` ne lève rien sur un nom de police introuvable : SwiftUI retombe en silence
      # sur la police système. Une famille renommée, un fichier oublié dans l'UIAppFonts d'une
      # cible, un nom PostScript qui n'est pas celui qu'on croit — rien de tout ça ne casse le
      # build, et ça ne se voit que sur l'appareil, écran par écran. Neuf builds sont partis avec
      # ce défaut avant qu'il soit compris. Cette vérification coûte une seconde et le rend
      # impossible à répéter.
      # La fiche a des limites de champ dures : au-delà, App Store Connect refuse le collage, et
      # ça ne se découvre qu'au moment de la saisie, après avoir tout rédigé. Le bloc d'abonnement
      # obligatoire a fait dépasser deux descriptions, et la vérification a été faite après
      # publication deux fois de suite.
      - name: Vérifier la fiche App Store
        run: python3 ci_scripts/check_listing.py

      - name: Vérifier que les polices demandées sont livrées
        run: python3 ci_scripts/check_fonts.py

      # ET MAINTENANT : SONT-ELLES LIVRÉES À LA CIBLE QUI LES ENREGISTRE ? Le contrôle ci-dessus
      # compare le code, l'`UIAppFonts` de chaque cible et les noms PostScript des fichiers — il
      # ne regarde jamais si la cible EMBARQUE le fichier. `RunUpWatch` et `RunUpWidgets`
      # déclaraient leurs ressources sous une clé `resources:` qui n'existe pas dans XcodeGen :
      # elle est jetée sans un mot (ticket #1645). Résultat, mesuré dans `RunUpWatch.app` : aucun
      # `.ttf`, aucun `Localizable.strings`. La montre et le widget de l'écran d'accueil étaient
      # donc français pour tout le monde, dans la police système, depuis le premier jour — avec
      # un build vert, le contrôle des polices vert, et des captures parfaitement lisibles.
      #
      # Haut placée volontairement : elle lit un fichier et coûte une seconde, et elle dit si la
      # construction qui suit vaut la peine d'être payée.
      - name: Vérifier que project.yml dit vraiment ce qu'il fait
        run: |
          cd ci_scripts && python3 test_spec.py
          cd .. && python3 ci_scripts/check_spec.py

      # LA RÈGLE 7 : AUCUN DÉGRADÉ DANS L'INTERFACE.
      #
      # Vingt-quatre fichiers en portaient un, et personne n'avait mal travaillé : UN jeton du
      # système de design le distribuait (`accentGradient`, `violetRoseGradient`), et les écrans
      # l'appelaient comme il faut. C'est la raison pour laquelle le brief dit « le design system
      # d'abord » — corriger les écrans sans corriger le jeton aurait tenu une semaine.
      #
      # Le contrôle compte les dégradés PAR FICHIER, contre une liste d'exceptions qui porte
      # chacune sa raison écrite : la marque, une image produite (carte de partage, avatar), un
      # voile qui rend un texte lisible sur un tracé, et l'anneau dont chaque arc vire vers la
      # couleur de son voisin. Un de plus ou un de moins, et il parle.
      - name: Vérifier qu'aucun dégradé décoratif n'est revenu
        run: |
          cd ci_scripts && python3 test_degrade.py
          cd .. && python3 ci_scripts/check_degrade.py

      # LA RÈGLE 7, DEUXIÈME MOITIÉ : PAS DE GLASSMORPHISM.
      #
      # Douze `Material` dans sept fichiers, et cette fois aucun jeton ne les distribuait : chaque
      # écran écrivait `.ultraThinMaterial` à la main. Quatre d'entre eux étaient posés DEVANT une
      # surface déjà opaque à plus de 90 % — ils ne floutaient que 4 à 8 % de la page, pour une
      # couche de composition de plus sur l'écran le plus vu de l'app.
      #
      # Trois autres étaient posés sur une carte MapKit, donc leur contraste dépendait de ce qui
      # défilait dessous : la bulle du coach portait quinze lignes d'arithmétique pour cette
      # raison. Avec un fond opaque, le calcul ne dépend plus de rien.
      #
      # La liste d'exceptions est VIDE, et c'est l'état qu'on veut.
      - name: Vérifier qu'aucun verre dépoli n'est revenu
        run: |
          cd ci_scripts && python3 test_verre.py
          cd .. && python3 ci_scripts/check_verre.py

      # UNE API « À MOTIF OBLIGATOIRE » SANS MANIFESTE EST UN REFUS À L'ENVOI.
      #
      # ITMS-91053 se déclenche sur l'USAGE d'une de ces API sans motif déclaré, et il tombe
      # APRÈS l'archive — quinze minutes de machine macOS pour l'apprendre. `RunUpWatch`
      # n'embarque aucun `PrivacyInfo.xcprivacy`, et c'est licite tant qu'elle n'appelle rien :
      # vérifié le 10 novembre 2026 sur le journal d'envoi, « UPLOAD SUCCEEDED with no errors »
      # pour une archive contenant `RunUp.app/Watch/RunUpWatch.app`.
      #
      # Une seule ligne rendrait ça faux : un `UserDefaults` écrit dans la montre pour y garder
      # un réglage. Elle compile, les tests passent, et le refus arrive à l'envoi. Ce contrôle
      # coûte une seconde et lit un fichier.
      - name: Vérifier qu'aucune cible n'appelle une API à motif obligatoire sans la déclarer
        run: |
          cd ci_scripts && python3 test_manifeste.py
          cd .. && python3 ci_scripts/check_manifeste.py

      # SOIXANTE SECONDES DE ROUE QUI TOURNE, C'EST UNE APP CASSÉE.
      #
      # Les douze requêtes du dépôt partaient sans délai déclaré, donc avec celui d'Apple. Le
      # défaut ne se voit jamais en développement : un aller-retour sur notre API prend 0,17 à
      # 0,51 seconde, mesuré. Il n'existe que chez quelqu'un dans un train — et là, `PanneReseau`
      # savait déjà écrire la bonne phrase, elle arrivait une minute trop tard.
      - name: Vérifier qu'aucune requête ne part sans délai
        run: |
          cd ci_scripts && python3 test_delais.py
          cd .. && python3 ci_scripts/check_delais.py

      # « L'ACHAT N'A PAS ABOUTI. » APRÈS UNE TRANSACTION SIGNÉE PAR APPLE.
      #
      # `purchase(_:)` posait la question du droit d'accès UNE FOIS, juste après
      # `transaction.finish()`, alors que `currentEntitlements` le publie quelques centaines de
      # millisecondes plus tard. Quelqu'un qui vient d'être débité lisait donc un avertissement
      # d'échec au-dessus d'un bouton d'achat toujours actif, et la statistique enregistrait un
      # `purchaseFailed` — soit un taux d'échec faux, qui pousse à corriger du code qui marche.
      #
      # Le piège était déjà connu et déjà contourné trente lignes plus bas pour les codes promo,
      # commentaire à l'appui. Deux chemins, un seul corrigé. Et invisible autrement qu'en payant
      # pour de vrai : dans un simulateur, l'entitlement arrive instantanément.
      - name: Vérifier que les issues de paiement se décident dans un type testé
        run: |
          cd ci_scripts && python3 test_paiement.py
          cd .. && python3 ci_scripts/check_paiement.py

      # QUATRE COEFFICIENTS ÉCRITS À LA MAIN DÉCIDAIENT DE CE QUE LES GENS COURENT.
      #
      # footing × 1,20, marathon × 1,08, seuil × 1,00, VMA × 0,87, sans source — le commentaire
      # disait « in the spirit of standard recreational running pace calculators ». Confrontés à
      # la table publiée de Jack Daniels, trois des quatre étaient faux : le footing 18 à 25 s/km
      # trop rapide à tous les niveaux, sur l'allure qui porte 70 à 80 % du volume d'une semaine ;
      # la VMA à l'allure du MILE, prescrite pour des répétitions de trois à cinq minutes.
      #
      # Et un test VERT interdisait la bonne réponse : il exigeait un écart seuil→VMA de 11 à 20 %
      # sur la foi d'un commentaire sans source, quand la table en donne 7,7 à 8,2 %.
      - name: Vérifier qu'aucune allure ne se décide par un coefficient écrit à la main
        run: |
          cd ci_scripts && python3 test_allures.py
          cd .. && python3 ci_scripts/check_allures.py

      # DU CODE ÉCRIT, TESTÉ, DOCUMENTÉ, ET QUE PERSONNE NE PEUT LANCER.
      #
      # GitHub ne construit le formulaire « Run workflow » que depuis la branche par défaut. Huit
      # actions de `appstore.yml` — dont l'envoi des captures de la montre et l'aperçu vidéo, deux
      # chantiers entiers — étaient déclarées ici et absentes de `main`, donc injoignables. Rien
      # ne le disait : le code existait, ses contrôles passaient, sa documentation le décrivait.
      #
      # `main` portait déjà un commit nommé « Le bouton qui envoie les captures doit vivre sur
      # main, sinon il n'existe pas ». La leçon n'a pas tenu faute d'être vérifiée.
      - name: Vérifier que les boutons existent là où GitHub les cherche
        run: |
          cd ci_scripts && python3 test_boutons.py
          cd .. && python3 ci_scripts/check_boutons.py

      # DEUX COULEURS ET TROIS GRAISSES POUR LA MÊME PHRASE : « IL N'Y A RIEN ICI ».
      #
      # `RUEmpty` existait et six écrans l'utilisaient ; seize endroits continuaient d'écrire le
      # leur, avec .bold/.semibold/.medium pour le titre, text3/text2 pour le message,
      # .small/.body pour le corps, .hero/.xlarge pour l'icône. Et le composant partagé était
      # LUI-MÊME le seul à ne pas utiliser `RUIconSize.hero`, dont la documentation dit « l'icône
      # d'un état vide, celle qu'on voit avant même de lire ».
      #
      # Ce contrôle garde ce qui se garde — le bloc écrit à la main, le site d'appel qui restyle,
      # le composant qui dérive — et DIT ce qu'il ne sait pas garder : la forme `.ligne` n'a
      # aucune signature détectable, et une règle à trente dispenses ne décrit pas un défaut.
      - name: Vérifier que l'état vide ne s'écrit qu'une fois
        run: |
          cd ci_scripts && python3 test_vides.py
          cd .. && python3 ci_scripts/check_vides.py

      # « 63 FICHIERS UTILISENT ForEach, 11 SEULEMENT UNE LISTE PARESSEUSE » NE MESURAIT RIEN.
      #
      # Un `ForEach` sur les sept jours de la semaine n'a aucun besoin d'être paresseux, et un
      # fichier qui en porte trois ne compte pas pour trois défauts. Le critère est la POSITION :
      # sous un `ScrollView`, sans conteneur paresseux entre les deux, toutes les lignes se
      # construisent à l'ouverture — y compris celles qu'on ne verra pas.
      #
      # Mesuré : 133 ForEach dans 63 fichiers, dix dans cette position, dont sept sur `allCases`
      # ou `0..<7`. Les deux écrans que l'item nommait — le fil du club et l'historique — étaient
      # déjà réglés. Il restait DEUX listes sans borne, chacune avec un avatar à décoder par ligne.
      - name: Vérifier qu'aucune liste sans borne ne se construit d'un bloc
        run: |
          cd ci_scripts && python3 test_listes.py
          cd .. && python3 ci_scripts/check_listes.py

      # `private` au niveau d'un membre porte sur la déclaration englobante ET SON FICHIER. Sortir
      # une section d'une grosse vue dans son propre fichier casse donc chaque appel à une
      # `private func` restée derrière — le projet ne compile plus, et aucun contrôle de cette
      # chaîne ne résout un symbole Swift. C'est arrivé le 10 novembre 2026 : la carte du défi,
      # sortie de `ClubView`, appelait `daysLeft(until:)`. Chaîne verte, build rouge.
      #
      # Ce contrôle ne compile rien. Il constate une impossibilité : un nom déclaré `private` dans
      # un seul fichier, appelé nu depuis un autre, ne peut pas se résoudre. Mesuré après
      # correction sur 301 fichiers : zéro. Sa première version regardait aussi les propriétés et
      # rendait 112 signalements, tous faux — des étiquettes d'argument.
      - name: Vérifier qu'aucune fonction privée n'est appelée hors de son fichier
        run: |
          cd ci_scripts && python3 test_prive.py
          cd .. && python3 ci_scripts/check_prive.py

      # La campagne 166 a photographié `4-club.png` — une des six images livrées à Apple — PENDANT
      # que le tracé de la sortie se dessinait : tête lumineuse figée au milieu du trait, ligne
      # arrêtée avant sa fin. La 165, six heures plus tôt, l'avait eu fini. C'est le minutage qui
      # décidait de ce qu'Apple reçoit.
      #
      # L'app fige donc ses animations en démonstration, SAUF quand on la filme. La distinction
      # tient à `--film`, posé par le seul `ApercuUITests`. Le drapeau est sur le film et pas sur
      # les photos parce que les deux oublis ne coûtent pas la même chose : un film sans mouvement
      # se voit en le regardant, une photo prise en plein vol ne se voit pas du tout.
      - name: Le film se déclare-t-il, et les photos sont-elles figées
        run: |
          cd ci_scripts && python3 test_film.py
          cd .. && python3 ci_scripts/check_film.py

      # Une clé absente du catalogue ne casse rien : `String(localized:)` rend la clé, et le texte
      # sort EN FRANÇAIS chez tout le monde. Ça ne se voit qu'en lançant l'app dans une autre
      # langue, sur l'écran concerné — autant dire jamais. L'audit en a trouvé cinq d'un coup,
      # dont deux écrites le jour même par quelqu'un qui corrigeait justement ce défaut.
      # Une demande d'autorisation non traduite ne casse rien : l'app compile, les tests passent,
      # l'envoi réussit. Xcode écrit simplement le NOM DE LA CLÉ dans le .lproj manquant, et le
      # dialogue système affiche « NSContactsUsageDescription » à qui a son téléphone dans cette
      # langue. Apple l'a renvoyé en ITMS-90738 sur la build 1158, après la livraison.
      - name: Vérifier que les demandes d'autorisation sont écrites partout
        run: python3 ci_scripts/check_infoplist.py

      - name: Vérifier que tout texte affiché est traduisible
        run: |
          cd ci_scripts && python3 test_strings.py
          cd .. && python3 ci_scripts/check_strings.py

      # UN GARDE-FOU QU'ON CROIT AVOIR EST PIRE QUE PAS DE GARDE-FOU : on cesse de regarder
      # l'endroit qu'il surveille. Quatre fois le même défaut, et jamais par négligence —
      # écrire le contrôle et le câbler sont deux gestes, et le premier donne le sentiment
      # d'avoir fini. `test_session.py` et `test_accent.py` existaient sans tourner.
      # `test_comparer.py` aurait été le troisième : ce contrôle l'a attrapé le jour même.
      # Il pose aussi deux questions de plus — un script a-t-il de quoi tourner (Pillow), et
      # est-il lancé par un fichier qui l'importe. La seconde lui a évité une fausse accusation :
      # `check_profile.py` n'est nommé nulle part et sa règle tourne à chaque build, appelée par
      # `profils.py`.
      # C'est volontairement une étape haut placée : elle coûte une seconde et elle dit si
      # les cinquante qui suivent sont bien toutes là.
      - name: Vérifier que chaque contrôle et chaque test est bien lancé
        run: |
          cd ci_scripts && python3 test_cablage.py
          cd .. && python3 ci_scripts/check_cablage.py


      # LE TRAIT QUI SÉPARE DEUX LIGNES ÉTAIT ÉCRIT DE DEUX FAÇONS, ET UNE DES DEUX ÉTAIT FAUSSE.
      #
      # Trente endroits posaient `Divider().background(RUColor.line)`. Le `Divider` de SwiftUI a
      # sa propre épaisseur — un pixel d'écran, un tiers de point sur un ×3 — et sa propre
      # couleur ; `.background` peint derrière lui, elle ne le recolore pas. Douze autres
      # dessinaient le bon filet à la main, sur une ligne qu'on ne relit pas et qu'on recopie.
      # Aucun contrôle ne le voyait, et aucune capture non plus : les écrans qui employaient
      # l'un des deux idiomes ne sont pas photographiés.
      - name: Vérifier que chaque filet passe par RUFilet
        run: |
          cd ci_scripts && python3 test_filet.py
          cd .. && python3 ci_scripts/check_filet.py

      # UN NOM DE SYMBOLE FAUX NE DESSINE RIEN, SANS ERREUR NI JOURNAL.
      #
      # `Image(systemName: "mountain.2.fill")` sur un nom inexistant rend un `Image` vide de la
      # bonne taille : la mise en page ne bouge pas, la construction est verte, les tests passent.
      # Le défaut ne se voit qu'en regardant l'écran concerné — autant dire jamais pour un écran
      # qu'on ne photographie pas. Ce contrôle-ci ne peut pas savoir si un nom existe : le
      # catalogue appartient au système. Il garantit que la liste éprouvée par `SymbolesTests`
      # est exactement celle que le code emploie ; c'est ce test, dans le simulateur, qui demande
      # à `UIImage(systemName:)` de résoudre chaque nom.
      - name: Vérifier que chaque symbole nommé est éprouvé par un test
        run: python3 ci_scripts/check_symboles.py

      # UN ATTRIBUT SÉPARÉ DE SA DÉCLARATION PAR UNE DOCUMENTATION CHANGE DE PROPRIÉTAIRE.
      #
      # Swift l'accepte, et l'attribut s'applique alors à la déclaration qui suit — c'est-à-dire,
      # après une insertion, à la fonction qu'on vient d'écrire. C'est arrivé deux fois : un
      # `@discardableResult` recollé sur `markSessionDone` (avertissement, resté), et `@MainActor`
      # recollé sur `viderLeStock`, qui a coûté une construction entière — quarante minutes, parce
      # qu'ici il n'y a pas de compilateur. Le troisième cas, dans `ClubService`, a été trouvé par
      # ce contrôle le jour où il a été écrit.
      - name: Vérifier que chaque attribut touche sa déclaration
        run: |
          cd ci_scripts && python3 test_attributs.py
          cd .. && python3 ci_scripts/check_attributs.py

      # Une commande dont le libellé est une icône ne s'annonce pas : VoiceOver dit « bouton », et
      # rien d'autre. Les siennes sont nommées une par une, et aucune n'est oubliée — cette
      # barrière n'est pas là pour rattraper une dette, elle est là pour que le prochain bouton
      # icône, écrit un soir dans une feuille modale, ne parte pas muet.
      - name: Vérifier que les commandes à icône ont un nom
        run: |
          cd ci_scripts && python3 test_a11y.py
          cd .. && python3 ci_scripts/check_a11y.py

      # `club_action_taken` existe pour décider du sort du Club sur des chiffres. Il a un point de
      # rupture silencieux : le jour où quelqu'un compte aussi la publication automatique — celle
      # qui part après chaque course — le compteur mesure l'app et plus le Club, il monte, et ça
      # ressemble à une bonne nouvelle.
      # La couleur de marque est recopiée dans le widget, la montre et la Live Activity — trois
      # processus séparés qui ne peuvent pas lire l'objet en mémoire de l'app. En oublier une ne
      # casse rien : ça donne juste un widget d'une autre couleur que l'écran d'accueil, ce qui
      # ressemble à un choix et n'est jamais signalé.
      # Le nom de l'en-tête de renouvellement est écrit côté client et côté serveur. S'ils
      # divergent, le serveur renouvelle dans le vide et elle se fait déconnecter tous les mois,
      # sans que le symptôme ressemble en rien à sa cause.
      # `test_session.py` et `test_accent.py` existaient tous les deux et AUCUN workflow ne les
      # lançait : les deux contrôles tournaient, leurs cas non. Un test qu'on n'exécute pas ne
      # garde rien — il donne seulement l'impression que l'analyse est éprouvée.
      - name: Vérifier que la session se renouvelle des deux côtés
        run: |
          cd ci_scripts && python3 test_session.py
          cd .. && python3 ci_scripts/check_session.py

      - name: Vérifier que la couleur de marque est la même partout
        run: |
          cd ci_scripts && python3 test_accent.py
          cd .. && python3 ci_scripts/check_accent.py

      # L'échelle de titrage avait vingt-six tailles écrites à la main, dont sept dans six points.
      # Le compilateur refuse maintenant un nombre nu ; il ne peut pas refuser la porte de
      # service `horsEchelle:`, et c'est par une porte de service que les vingt-six étaient
      # arrivées — une exception qui rend la suivante normale.
      # LES ICÔNES ÉTAIENT LA TROISIÈME FAMILLE, ET LA DERNIÈRE SANS ÉCHELLE.
      #
      # Vingt-deux tailles écrites à la main sur 170 appels, de 8 à 72 points, dont 13, 14 et 15
      # voisinant sur 76 d'entre eux. Le compilateur ne peut rien : `.font(.system(size:))` est
      # une API de SwiftUI. Ce contrôle fixe donc la liste des exceptions, avec leur compte et
      # leur raison — il en reste deux depuis le passage aux chevrons SF, et ce sont des glyphes
      # typographiques, pas des icônes. Le test DÉRIVE ce nombre de la liste au lieu de le
      # répéter : il l'avait répété, et TestFlight est passé au rouge dix minutes après le
      # commit qui ramenait quatre à deux.
      - name: Vérifier qu'aucune taille d'icône n'est écrite à la main
        run: |
          cd ci_scripts && python3 test_icones.py
          cd .. && python3 ci_scripts/check_icones.py

      - name: Vérifier que l'échelle de titrage reste fermée
        run: python3 ci_scripts/check_echelle.py

      # Dix-neuf écarts verticaux continus de 0 à 22, et trente-trois valeurs de marge. `spacing: 9`
      # à côté de cent `spacing: 8` est un nombre parfaitement valide pour le compilateur, et c'est
      # comme ça que les dix-neuf sont arrivées — une par une, sans que personne ait à les défendre.
      - name: Vérifier que les écarts et les marges tiennent sur la grille
        run: python3 ci_scripts/check_grille.py

      # Un grand nombre et son unité : neuf endroits, neuf traitements, quatre tailles d'unité et
      # cinq graisses. Les deux lignes sont valides séparément, donc rien d'autre ne le remarque —
      # et c'est l'objet le plus regardé d'une app de course.
      - name: Vérifier qu'un chiffre et son unité passent par le composant partagé
        run: python3 ci_scripts/check_chiffres.py

      # La teinte d'un en-tête de carte était passée à 55 endroits sur huit valeurs, sans règle :
      # sur une seule rangée de l'écran Stats, règle rose, coureur violet, horloge turquoise. Et
      # `lime` et `amber` VEULENT DIRE quelque chose deux centimètres plus loin, dans les
      # pastilles d'écart — les dépenser en décoration vide de son sens le seul endroit où la
      # couleur parlait.
      - name: Vérifier que les teintes d'en-tête nomment quelque chose
        run: python3 ci_scripts/check_teintes.py

      # Le nom de quelqu'un s'écrit à un seul endroit : trois façons de le réécrire à côté, et
      # c'est par là que « Charlotte » et « Charlotte Grudé » ont fini par coexister.
      - name: Vérifier que le nom de quelqu'un ne s'écrit qu'à un endroit
        run: python3 ci_scripts/check_nom.py

      - name: Vérifier que le compteur du Club ne compte que des gestes délibérés
        run: python3 ci_scripts/check_club_metrics.py

      # La même liste d'événements existe en Swift et en JavaScript, dans deux déploiements, sans
      # compilateur entre les deux. Quand elles ont divergé, onze événements sur vingt-quatre
      # étaient jetés — dont l'entonnoir d'abonnement en entier — et la panne était silencieuse
      # des deux côtés : l'app recevait un 200, la table ne gardait rien, et le tableau de bord
      # rendait zéro comme si personne n'utilisait la fonctionnalité.
      - name: Vérifier que le client et le serveur connaissent les mêmes événements
        run: python3 ci_scripts/check_events.py

      # La même duplication, pour les genres de panne — et cette fois la divergence n'aurait
      # AUCUN symptôme. Un rapport de panne n'arrive que quand ça va mal : il n'y a pas de
      # volume quotidien dont la chute sauterait aux yeux, et une table de pannes vide ressemble
      # trait pour trait à une app qui ne plante pas. Ce contrôle vérifie en plus que le
      # manifeste de confidentialité déclare bien ce que l'app envoie : une déclaration
      # incomplète fait refuser le binaire à l'ENVOI, avant toute revue humaine.
      - name: Éprouver le contrôle des genres de panne
        run: |
          cd ci_scripts && python3 test_pannes.py
      - name: Vérifier que le client, le serveur et le manifeste s'accordent sur les pannes
        run: python3 ci_scripts/check_pannes.py

      # TROIS ENDROITS DISENT CE QUE L'APP COLLECTE, ET ILS DOIVENT DIRE LA MÊME CHOSE : le
      # manifeste livré dans le binaire, la politique publiée (gardée par `check_politique.py`),
      # et la fiche « App Privacy » d'App Store Connect. Une divergence entre le manifeste et la
      # fiche est un motif de rejet à part entière.
      #
      # La troisième est la seule que rien ne pouvait tenir : l'API d'App Store Connect ne sait
      # ni la lire ni l'écrire — vérifié dans la spécification OpenAPI d'Apple (v4.6), 1 027
      # chemins et aucun pour la confidentialité. Ce contrôle DÉRIVE donc du manifeste le tableau
      # exact à saisir et vérifie qu'il est bien celui écrit dans `APP_STORE_LISTING.md`. La
      # fiche se remplit en recopiant un tableau qu'une machine tient à jour.
      - name: Éprouver le contrôle de la fiche de confidentialité
        run: |
          cd ci_scripts && python3 test_confidentialite.py
      - name: La fiche de confidentialité est-elle d'accord avec le manifeste
        run: python3 ci_scripts/check_confidentialite.py

      # La chaîne des captures ne part pas à chaque commit : sa liste de chemins est un jugement
      # écrit à la main, et elle s'est trompée DEUX FOIS par omission — `AppState.swift` le
      # routeur, puis `RunUpApp.swift` qui porte la vue racine. Le défaut n'a aucun symptôme :
      # la chaîne reste verte parce qu'elle ne tourne pas, et les images en ligne datent d'avant
      # la modification.
      - name: Éprouver le contrôle du déclencheur des captures
        run: |
          cd ci_scripts && python3 test_declencheur.py
      - name: Vérifier que toute vue relance les captures
        run: python3 ci_scripts/check_declencheur.py

      # Une somme sur des relevés doit dire de quelle discipline elle parle. Sans ça, la première
      # sortie vélo entre dans la distance courue, emporte le record d'allure que personne ne
      # reprendra, use les chaussures et coche la séance de course du jour — sans qu'une seule
      # ligne ne casse ni qu'un seul écran ne vire au rouge.
      # Une phrase qui s'accorde en genre doit exister dans les DEUX formes. Un homme à qui
      # l'app répond « tu es seule dans ce club » n'a pas affaire à une voix : il a affaire à une
      # app qui ne l'a pas écouté. Et une phrase mal accordée ne casse rien, ne lève aucune
      # alerte, et ne se voit que par la personne à qui elle s'adresse mal.
      - name: Vérifier que les phrases accordées ont leurs deux formes
        run: python3 ci_scripts/check_accord.py

      - name: Vérifier que les agrégations distinguent les disciplines
        run: |
          cd ci_scripts && python3 test_disciplines.py
          cd .. && python3 ci_scripts/check_disciplines.py

      # `HKSource.default()` lève une exception Objective-C — que Swift ne peut PAS rattraper —
      # quand le binaire tourne sans le droit HealthKit. La construction des captures d'écran
      # n'est pas signée : l'app y mourait au lancement, quatre exécutions de suite, avec un
      # rapport de plantage qu'il fallait aller chercher dans le simulateur. Un coupe-circuit
      # règle le cas ; ce test garantit qu'aucune porte d'entrée ajoutée demain ne le contourne.
      - name: Vérifier qu'aucun appel à Santé ne contourne le coupe-circuit
        run: |
          cd ci_scripts && python3 test_healthkit.py
          cd .. && python3 ci_scripts/check_healthkit.py

      # Le club de démonstration des captures d'écran est du JSON écrit à la main, décodé dans
      # des structures Swift qui, elles, bougent. Il lui manquait trois champs non optionnels :
      # le décodage échouait en entier, le cache restait vide, et l'écran du Club montrait
      # « Créer un club » sous l'accroche « Tu ne cours jamais seule ». Rien ne plantait, le
      # workflow était vert, et seule la relecture de l'image l'a révélé — après vingt minutes.
      - name: Vérifier que le club de démonstration se décode
        run: |
          cd ci_scripts && python3 test_captures_seed.py
          cd .. && python3 ci_scripts/check_captures_seed.py

      # Une capture rangée sous le mauvais type d'appareil n'échoue pas : elle apparaît au
      # mauvais endroit dans la fiche, et on l'apprend en la regardant. La taille de l'image
      # est ce qui décide, et elle se lit dans l'en-tête du PNG — donc ça se teste sans réseau.
      - name: Vérifier ce que l'envoi des captures décide hors ligne
        run: cd ci_scripts && python3 test_asc_captures.py

      # Le build 1177 a planté au lancement chez tout le monde sur une ligne qui compilait et
      # dont les tests passaient : une propriété de type personnalisé, non optionnelle, ajoutée à
      # un modèle SwiftData. La migration réussit, ajoute la colonne à NULL, et le premier accès
      # est fatal. Aucune relecture n'attrape ça ; une machine, si.
      - name: Vérifier qu'aucune propriété de modèle ne plantera au lancement
        run: |
          cd ci_scripts && python3 test_model_defaults.py
          cd .. && python3 ci_scripts/check_model_defaults.py

      # Le même genre de panne, un étage plus bas, et en pire. Le build 1252 est mort 0,2 seconde
      # après son lancement chez quelqu'un dont le programme enregistré contenait une séance que
      # le décodeur ne savait plus relire — et comme la donnée est sur le disque, réinstaller une
      # version antérieure n'y changeait rien. Le décodeur de SwiftData ARRÊTE LE PROCESSUS sur un
      # `decode` dont la clé manque, là où `decodeIfPresent` rendrait nil ; et Swift synthétise
      # `decode` pour toute propriété non optionnelle, valeur par défaut comprise.
      - name: Vérifier que les structures enregistrées survivent à une clé manquante
        run: |
          cd ci_scripts && python3 test_decodage.py
          cd .. && python3 ci_scripts/check_decodage.py

      # Le programme est REGÉNÉRÉ — au passage de semaine, à chaque changement de réglage, et
      # même sans que personne ne demande rien : l'allègement du coach expire tout seul au
      # lancement et déclenche la régénération. Tout ce qui est écrit à la main dans la semaine
      # disparaît donc au passage suivant. Deux changements l'avaient oublié : le déplacement
      # d'une séance et l'allègement du jour. Un déplacement posé mardi n'existait plus jeudi
      # matin, et l'allègement pouvait rendre la séance PLUS DURE que la demande qui l'avait
      # allégée. Aucun des deux n'avait de symptôme : la semaine restait pleine et juste.
      - name: Vérifier que la semaine du plan ne s'écrit qu'à la génération
        run: |
          cd ci_scripts && python3 test_entrees.py
          cd .. && python3 ci_scripts/check_entrees.py

      # L'adresse de la politique de confidentialité était écrite en dur à NEUF endroits. Le dépôt
      # a changé de propriétaire, GitHub Pages a suivi, et les neuf copies pointaient toujours vers
      # l'ancien domaine — qui répond 404. Aucune conséquence bruyante, et deux graves : la fiche
      # App Store annonçait une politique introuvable, ce qu'Apple exige de fournir, et le lien du
      # paywall ouvrait une page d'erreur au moment où quelqu'un s'apprête à payer.
      - name: Vérifier que les pages publiées sont annoncées avec la même adresse
        run: |
          cd ci_scripts && python3 test_liens.py
          cd .. && python3 ci_scripts/check_liens.py

      # L'inscription décrit ses étapes à TROIS endroits : le switch qui choisit la vue, celui
      # qui la nomme pour les statistiques, et celui qui décide si on peut la quitter. Insérer
      # une étape au milieu oblige à décaler les trois ; en oublier un a suffi pour que l'écran
      # des jours de course valide les réponses de son voisin et laisse passer une semaine à
      # zéro jour. Ça compilait, les tests passaient, l'écran s'affichait.
      - name: Vérifier que les étapes de l'inscription sont d'accord entre elles
        run: |
          cd ci_scripts && python3 test_etapes.py
          cd .. && python3 ci_scripts/check_etapes.py

      # Neuf feuilles sur trente-trois s'ouvraient avec l'habillage du SYSTÈME : fond clair dans
      # une app sombre, coins à 10 points au lieu de 26, aucune poignée. `runUpSheetStyle`
      # existait et vingt-quatre feuilles l'appliquaient ; c'est le propre d'un style qu'on pose
      # à la main de manquer là où personne n'a regardé.
      - name: Vérifier que toute feuille porte l'habillage de l'app
        run: |
          cd ci_scripts && python3 test_feuilles.py
          cd .. && python3 ci_scripts/check_feuilles.py

      # Le mot « RUN » a disparu de la barre du bas pendant tout un build, sans rien signaler :
      # le plus haut des cinq éléments mesurait 56,2 points dans une barre de 56, et comme la
      # barre passe par un `ViewThatFits`, ce qui dépasse ne déborde pas — il disparaît. Deux
      # dixièmes de point, aucun symptôme intermédiaire, trois tours pour le voir. Ce contrôle
      # refait l'addition depuis les constantes et exige de la marge.
      - name: Vérifier que la barre du bas tient ses libellés
        run: |
          cd ci_scripts && python3 test_barre.py
          cd .. && python3 ci_scripts/check_barre.py

      # Rien d'autre ne garde la conversation avec le coach, les ressentis, les chaussures, la
      # série ou le programme : Apple Santé n'a que les courses. Et un filet se dégrade en
      # silence — on ajoute un champ au modèle un mardi, la sauvegarde ne le connaît pas, et la
      # perte ne se voit qu'une fois, au pire moment. Ce contrôle refuse une propriété
      # enregistrée qui ne serait ni sauvegardée ni déclarée volontairement dehors.
      - name: Vérifier qu'aucune donnée ne sort du filet de sauvegarde
        run: |
          cd ci_scripts && python3 test_sauvegarde.py
          cd .. && python3 ci_scripts/check_sauvegarde.py

      # « Vérifie ta connexion » était affiché pour une session expirée comme pour un serveur en
      # panne, depuis onze écrans. C'est la pire des trois pannes à deviner : c'est la seule que la
      # personne peut vérifier d'un coup d'œil, et sur un téléphone au wifi plein elle n'apprend
      # rien sur la panne et beaucoup sur l'app. Le compilateur n'empêche pas de retaper la phrase
      # à la main ; ce contrôle, si.
      - name: Vérifier qu'aucun écran n'invente de panne de réseau
        run: |
          cd ci_scripts && python3 test_reseau.py
          cd .. && python3 ci_scripts/check_reseau.py

      # `RunUp/Shared/` n'est pas une bibliothèque prêtée au widget : le dossier ENTIER est dans
      # les sources de `RunUpWidgets`, qui ne compile rien d'autre de `RunUp/`. Un fichier posé là
      # ne voit donc ni les modèles, ni le design system, ni les vues-modèles — mais tout compile
      # sous les yeux, parce que la cible iOS, elle, voit tout. L'erreur ne tombe que dans la passe
      # du widget, un quart d'heure après le push, et elle annule le build entier. C'est arrivé
      # deux fois : `PlanRecap` au build 250, `AccentTheme` au build 278. Ce contrôle refait le
      # calcul de visibilité depuis `project.yml` en une seconde.
      - name: Vérifier que RunUp/Shared ne référence aucun type absent des cibles secondaires
        run: |
          cd ci_scripts && python3 test_cibles.py
          cd .. && python3 ci_scripts/check_cibles.py

      # Zéro est au singulier en français (« 0 course ») et au PLURIEL en anglais et en espagnol
      # (« 0 runs »). La bascule était écrite `n > 1` sur trente sites : une anglophone qui
      # s'inscrit lisait « 0 run », « 0 badge », « 0 day in a row », « 0 follower » le jour même,
      # sur les écrans d'un compte neuf. Quatre de ces sites recollaient en plus le « s » DANS la
      # chaîne, ce qui fabriquait la clé à l'exécution — ni « %lld sortie » ni « %lld sorties »
      # n'étaient au catalogue, et ces libellés sortaient en français pour tout le monde sans que
      # `check_strings.py` puisse le voir.
      - name: Vérifier qu'aucun pluriel n'applique la règle française aux trois langues
        run: |
          cd ci_scripts && python3 test_pluriel.py
          cd .. && python3 ci_scripts/check_pluriel.py

      # `String(format: "%.1f", km)` n'est pas neutre : sans `locale:`, il pose le séparateur
      # décimal anglais. « 12.4 km » s'affichait donc tel quel en français et en espagnol, deux
      # langues qui écrivent « 12,4 ». Quatorze des seize appels du dépôt passaient bien la
      # locale ; deux l'avaient oubliée. La bonne version et la mauvaise se ressemblent trop pour
      # se relire.
      - name: Vérifier qu'aucun nombre à virgule n'est formaté sans locale
        run: |
          cd ci_scripts && python3 test_decimales.py
          cd .. && python3 ci_scripts/check_decimales.py

      # `RUColor.text4` vaut 20 % d'opacité — environ 1,5:1 — parce que c'est la couleur des
      # points médians et des filets inertes. L'audit l'a trouvée sur une vraie phrase : la ligne
      # qui dit ce que contient la section dépliable des Stats ne se lisait pas. Rien ne pouvait
      # le signaler, `text4` étant une couleur légitime du système de design : d'où un ensemble
      # fermé d'emplois justifiés, et la question posée à tout nouvel emploi.
      - name: Vérifier qu'aucun texte n'est affiché sous le seuil de contraste
        run: |
          cd ci_scripts && python3 test_contraste.py
          cd .. && python3 ci_scripts/check_contraste.py

      # Les trois jetons de texte secondaires étaient des opacités de noir et de blanc, donc leur
      # couleur était décidée par la surface posée derrière, et leurs rapports de contraste ne
      # vivaient que dans un commentaire. Ce garde les lit dans `Colors.swift`, reconstruit ce que
      # les opacités rendaient, et refuse toute valeur qui perdrait du contraste sur l'un des cinq
      # fonds — les quatre surfaces littérales et une borne du fond teinté. Il imprime le tableau
      # mesuré, qui n'est donc recopié nulle part.
      - name: Vérifier les jetons de texte — opaques, en famille, aucun contraste perdu
        run: |
          cd ci_scripts && python3 test_jetons_de_texte.py
          cd .. && python3 ci_scripts/check_jetons_de_texte.py

      # DESIGN.md porte la direction artistique pour qu'elle ne dépende plus d'une conversation.
      # Un tel document dérive sans bruit : quelqu'un règle une valeur, le document continue
      # d'annoncer l'ancienne, et on le lit en croyant savoir. Il CITE donc le code — palette,
      # nuanciers, teintes de famille, échelles, durées — et ce garde vérifie la citation. Il
      # refuse aussi un garde cité qui n'existe pas : le document promettrait une barrière que
      # personne ne tient, ce qu'il faisait à trois endroits le jour où il a été écrit.
      - name: Vérifier que DESIGN.md décrit l'app telle qu'elle est
        run: |
          cd ci_scripts && python3 test_design.py
          cd .. && python3 ci_scripts/check_design.py

      # Deux encres de l'app sont RECOPIÉES hors du système de design, et ne peuvent pas ne pas
      # l'être : celle du widget traverse une frontière de cible, celle de `onAccent` répond à une
      # question que `textPrimary` ne pose pas. Le 12 novembre, le fond clair est passé au chaud et
      # les deux sont restées froides — le widget aurait porté l'ancienne encre sur l'écran
      # d'accueil du téléphone. Une copie est tolérée ; une copie sans correspondance déclarée non.
      - name: Vérifier que les encres recopiées suivent le système de design
        run: |
          cd ci_scripts && python3 test_encres.py
          cd .. && python3 ci_scripts/check_encres.py

      # La carte de nuit est le seul élément authored de l'app, et elle était peinte avec les
      # jetons de la PAGE : l'anneau de départ du tracé en `textPrimary`, soit du presque-noir
      # sur du presque-noir dès que le thème est clair — sur la capture, un trou dans la lueur.
      # Et le tracé portait l'accent descendu pour le fond blanc : lime y perdait 58 % de son
      # éclat, cyan 49 %, ambre 48 %. Aucun des trois n'avait de symptôme technique.
      - name: Vérifier que rien de la page n'est peint sur la nuit
        run: |
          cd ci_scripts && python3 test_nuit.py
          cd .. && python3 ci_scripts/check_nuit.py

      # `lineLimit(1)` sans `minimumScaleFactor`, c'est une troncature. Sur une phrase elle se
      # voit ; sur un NOMBRE elle ment — « 1:23:45 » devient « 1:23… » et rien ne dit que ce n'est
      # pas l'heure complète. Trouvé sur l'écran de séance, où ni le chrono ni l'allure cible n'en
      # portaient, et où « CIBLE 10:30/km » débordait des 284 points utiles de l'iPhone le plus
      # étroit dès 1,31× de taille de texte — l'app en autorise 2,00×.
      - name: Vérifier qu'aucun grand chiffre ne peut se tronquer en silence
        run: |
          cd ci_scripts && python3 test_grands_chiffres.py
          cd .. && python3 ci_scripts/check_grands_chiffres.py

      # L'animation d'ouverture joue trois mouvements décalés, puis s'efface après un délai fixe.
      # Personne n'avait jamais additionné les deux : le dévoilement finissait à 1,38 s quand le
      # fondu commençait à 1,15, donc 29 % du mouvement d'ouverture de l'app se jouait pendant
      # que l'écran disparaissait déjà. Chaque valeur était raisonnable toute seule — le défaut ne
      # vivait que dans leur somme, et il revient dès qu'on touche à une durée de RUMotion.
      - name: Vérifier que l'ouverture est finie avant que l'écran ne s'efface
        run: |
          cd ci_scripts && python3 test_lancement.py
          cd .. && python3 ci_scripts/check_lancement.py

      # « Le contenu au milieu, le bouton en bas » centre joliment tant que le contenu est plus
      # court que l'écran. À deux fois la taille de texte — que l'app autorise — les `Spacer`
      # tombent à zéro et le bouton sort par le bas. En bas de `PlanRecapView`, c'est
      # « C'EST PARTI » : quelqu'un qui agrandit le texte pour pouvoir lire l'app ne pouvait pas
      # finir de s'y inscrire.
      - name: Vérifier qu'aucun écran d'inscription ne cache son propre bouton
        run: |
          cd ci_scripts && python3 test_inscription.py
          cd .. && python3 ci_scripts/check_inscription.py

      # Les tests tournent AVANT la signature, sur simulateur, donc sans certificat : un échec
      # coûte cinq minutes de machine au lieu de la construction complète. Et surtout,
      # `RouteSharingPrivacyTests` vérifie que les 300 premiers et derniers mètres d'un tracé
      # partagé sont bien retirés — c'est la seule promesse de cette app dont la rupture publierait
      # l'adresse de quelqu'un. Aucun build ne doit partir aux testeurs sans qu'elle ait été
      # vérifiée.
      # La règle qui décide si un profil est encore bon tourne en production à chaque build et
      # décide seule d'en supprimer un chez Apple. Elle se vérifie sans réseau, en une seconde.
      - name: Vérifier la règle des profils de provisionnement
        run: python3 ci_scripts/test_profils.py

      # L'image de montre qu'Apple EXIGE en plus des six de l'iPhone a vieilli de trois mois sans
      # que rien ne rougisse, parce que rien ne la regardait. (Il y avait aussi une image d'iPad :
      # elle n'aurait jamais dû exister — RUNUP est une app iPhone, voir `captures.yml`.) Le
      # contrôle est ici, qui tourne souvent, ET dans `appstore.yml`, juste avant la composition :
      # une capture refaite ne passe pas par ce workflow-ci (`appstore/**` est dans son
      # `paths-ignore`), et c'est précisément le moment où une image livrée se périme.
      - name: Éprouver le contrôle des captures exigées
        run: python3 ci_scripts/test_requis.py

      - name: Les captures exigées montrent-elles l'app d'aujourd'hui
        run: python3 ci_scripts/check_requis.py

      - name: Tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 -E '^ *iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "✗ Aucun simulateur iPhone disponible sur cette machine."
            xcrun simctl list devices available
            exit 1
          fi
          echo "→ Simulateur : $UDID"
          # La sortie est conservée pour pouvoir en extraire les erreurs ci-dessous. Sans ça, un
          # build raté ne dit RIEN depuis l'API GitHub : les logs sont servis par un stockage
          # séparé que tous les clients ne contactent pas, et l'annotation se réduit à « exit
          # code 65 ». Deux corrections ont été poussées à l'aveugle avant qu'on s'en aperçoive.
          set +e
          xcodebuild test \
            -project RunUp.xcodeproj \
            -scheme RunUp \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/tests.log"
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "────────── ce qui a échoué ──────────"
            LOG="$RUNNER_TEMP/tests.log"
            # LE BRUIT D'EXÉCUTION D'ABORD, et ce n'est pas un détail de confort.
            #
            # CoreData et les journaux de l'app écrivent « error: » par centaines sans qu'aucune
            # soit une erreur de construction. Et le `sort -u` de la version précédente les faisait
            # GAGNER : une ligne commençant par une date trie avant une ligne commençant par un nom
            # de fichier, donc les vingt annotations étaient vingt lignes d'horodatage CoreData et
            # la vraie cause n'apparaissait pas du tout. Un build raté redevenait muet, ce que cette
            # extraction existe précisément pour empêcher.
            grep -vE "CoreData: error:|^[0-9]{4}-[0-9]{2}-[0-9]{2} |\[error\]" "$LOG" > "$LOG.propre" || true
            # Par ORDRE D'UTILITÉ, et sans retrier : erreurs de compilation, échecs de test,
            # édition de liens, puis le verdict. `awk` déduplique en gardant l'ordre, là où
            # `sort -u` l'aurait détruit une seconde fois.
            {
              grep -hE "\.swift:[0-9]+:[0-9]+: (error|fatal error):" "$LOG.propre" || true
              grep -hE "\.swift:[0-9]+: error:" "$LOG.propre" || true
              grep -hE "^(ld|clang|swiftc|xcodebuild): error:|error: linker command failed" "$LOG.propre" || true
              grep -hE "Test Case .* failed|Testing cancelled" "$LOG.propre" || true
              grep -hE "^\*\* (TEST|BUILD) [A-Z]+ \*\*" "$LOG.propre" || true
            } | sed -E 's#^.*/([^/]+\.swift)#\1#' | awk '!vu[$0]++' | head -25 \
              | while IFS= read -r L; do echo "::error::$L"; done
            exit "$CODE"
          fi

      # Le certificat de distribution vit dans un trousseau JETABLE, créé ici et détruit à la fin
      # du job (voir la dernière étape). Il n'est jamais ajouté au trousseau par défaut de la
      # machine : les machines GitHub sont réinitialisées entre deux exécutions, mais compter
      # là-dessus pour une clé privée de signature serait une hypothèse, pas une garantie.
      - name: Installer le certificat de signature
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/runup-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          CERT="$RUNNER_TEMP/dist.p12"
          echo "$CERT_P12_BASE64" | base64 -d > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          # Sans ça, macOS ouvre une boîte de dialogue « autoriser codesign à utiliser cette
          # clé ? » — sur une machine sans écran, la construction reste bloquée jusqu'au délai.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Le trousseau doit figurer dans la liste de recherche, sinon codesign ne le regarde pas.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT"
          echo "→ Identités disponibles :"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/[0-9A-F]\{40\}/…/'

      # La clé d'API App Store Connect sert deux fois : à laisser Xcode créer et télécharger les
      # profils de signature des trois bundle IDs (`-allowProvisioningUpdates`), puis à envoyer
      # l'IPA. `altool` la cherche à cet emplacement précis, sous ce nom précis.
      - name: Installer la clé d'API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Les profils de provisionnement de DISTRIBUTION, fabriqués à chaque build au lieu d'être
      # stockés en secrets.
      #
      # La signature automatique a bien fonctionné pour ARCHIVER — Xcode crée des profils de
      # DÉVELOPPEMENT tout seul. Mais l'export vers l'App Store réclame des profils de
      # DISTRIBUTION, que la signature automatique ne sait obtenir que par la « signature dans le
      # nuage », laquelle a répondu « Cloud signing permission error » sur les trois bundle IDs
      # avec une clé d'équipe Admin. Fournir les profils à l'avance supprime cette dépendance.
      #
      # Ils l'étaient par trois secrets, et ce choix avait un défaut qui a fini par coûter cher :
      # UN PROFIL EST UNE PHOTO DES CAPACITÉS PRISES LE JOUR DE SA CRÉATION. Ajouter WeatherKit
      # à `project.yml` a périmé les trois photos d'un coup, et la chaîne
      # est restée rouge jusqu'à ce qu'un humain retrouve une machine, le portail Apple, et refasse
      # les trois à la main. Deux fois sur ce trajet, l'encodage a produit un secret VIDE sans que
      # rien ne le signale.
      #
      # `ci_scripts/profils.py` les DEMANDE à Apple ici, avec la clé d'API installée juste au-dessus.
      # Un profil fabriqué il y a trente secondes porte les capacités d'il y a trente secondes :
      # cette panne n'a plus d'endroit où se produire, et il n'y a plus de secret à tenir à jour.
      #
      # Reste un cas qui demande un humain : si la capacité n'est pas cochée sur l'IDENTIFIANT
      # D'APP, aucun profil ne la portera. Le script le distingue et le dit explicitement.
      #
      # Rien n'est codé en dur ici : le bundle ID, le nom et l'UUID sont LUS dans chaque profil.
      - name: Fabriquer et installer les profils de provisionnement
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MAP="$RUNNER_TEMP/profile-map.txt"
          python3 ci_scripts/profils.py "$DIR" "$MAP"
          echo "PROFILE_MAP=$MAP" >> "$GITHUB_ENV"

      - name: Archiver
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project RunUp.xcodeproj \
            -scheme RunUp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/RunUp.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      # Les options d'export sont ÉCRITES ICI, à partir des profils réellement installés, plutôt
      # que lues dans un fichier versionné : la correspondance bundle ID → profil ne peut donc pas
      # mentir sur ce que la machine a sous la main.
      #
      # Plus de `-allowProvisioningUpdates` ni de clé d'authentification sur cette commande : c'est
      # exactement ce qui déclenchait la signature dans le nuage. Tout ce dont l'export a besoin
      # est déjà sur la machine — le certificat dans le trousseau, les trois profils dans le
      # dossier où Xcode les cherche.
      - name: Exporter l'IPA
        run: |
          set -euo pipefail
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          python3 - "$PROFILE_MAP" "$OPTS" <<'PYTHON'
          import sys, plistlib
          profiles = {}
          for line in open(sys.argv[1]):
              line = line.strip()
              if line:
                  bundle, name = line.split("=", 1)
                  profiles[bundle] = name
          plistlib.dump({
              # « app-store-connect » depuis Xcode 15.4 ; « app-store » ne fait plus que
              # survivre par compatibilité.
              "method": "app-store-connect",
              "teamID": "SW49TQ25NV",
              "signingStyle": "manual",
              # Le trousseau contient aussi deux identités de DÉVELOPPEMENT ; nommer la famille
              # évite que codesign attrape la mauvaise.
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": profiles,
              "uploadSymbols": True,
              # À `true` (le défaut), Xcode réécrirait le numéro de build à l'export et le lien
              # entre un build TestFlight et le commit qui l'a produit serait rompu.
              "manageAppVersionAndBuildNumber": False,
          }, open(sys.argv[2], "wb"))
          PYTHON
          echo "→ Options d'export :"
          plutil -p "$OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RunUp.xcarchive" \
            -exportOptionsPlist "$OPTS" \
            -exportPath "$RUNNER_TEMP/export" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
          ls -lh "$RUNNER_TEMP/export"

      # Gardé 14 jours. Quand un envoi est refusé par App Store Connect, c'est ce fichier qu'on
      # inspecte — sans lui, il faut relancer toute la construction pour comprendre.
      - name: Conserver l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: RunUp-${{ steps.build.outputs.number }}.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Envoyer à TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "→ Envoi de $(basename "$IPA")"
          # `--upload-package` demanderait de décrire le paquet à la main ; `--upload-app` lit
          # tout dans l'IPA, et refuse un binaire invalide avec les mêmes messages que la
          # validation séparée — laquelle téléverserait l'IPA une deuxième fois pour rien.
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "✓ Build ${{ steps.build.outputs.number }} envoyé."
          echo "  Apple met dix à trente minutes à le traiter avant qu'il apparaisse dans TestFlight."

      # `if: always()` : une construction qui échoue à mi-chemin ne doit pas laisser derrière elle
      # un trousseau déverrouillé contenant la clé privée de signature, ni la clé d'API.
      - name: Effacer les secrets de la machine
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/runup-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys
