# Les captures de la fiche App Store, fabriquées par la machine.
#
# Onglet **Actions** → **Captures App Store** → **Run workflow**.
#
# ─── CE QU'IL REMPLACE ──────────────────────────────────────────────────────────────────────────
#
# Dix-huit captures prises à la main sur un téléphone — six écrans, trois langues — à refaire à
# chaque changement d'accent, de police ou de mise en page. En pratique ça veut dire qu'on ne les
# refait pas : les six en ligne dataient du 30 août, portaient l'ancien rose, et seules quatre des
# six existaient, en français seulement.
#
# ─── CE QU'IL FAIT ──────────────────────────────────────────────────────────────────────────────
#
# 1. Construit l'app en DÉBOGAGE pour un simulateur. C'est la condition de tout : l'état de
#    démonstration vit sous `#if DEBUG` (voir `CaptureSeed`), donc une construction Release
#    photographierait l'écran d'inscription.
# 2. Lance `RunUpUITests` DEUX fois par langue : une passe en thème sombre, une en thème clair.
#    Le test ouvre l'app six fois par passe, chaque fois directement sur l'écran voulu, et écrit
#    le PNG sur le disque de la machine. La passe claire livre la fiche ; la passe sombre produit
#    le dossier `diagnostic/`, celui qu'on regarde pour juger l'app écran par écran.
# 3. Compose les six images finales par langue avec `ci_scripts/screenshots.py` — fond os, trace
#    continue, accroche — et publie tout en artefact téléchargeable.
#
# AUCUN SECRET N'EST NÉCESSAIRE. Rien n'est signé, rien n'est envoyé à Apple : on construit pour
# un simulateur et on produit des images. C'est aussi pour ça que ce workflow est séparé de
# `testflight.yml`, qui lui en demande neuf.

name: Captures App Store

# DEUX FAÇONS DE LE DÉCLENCHER, ET LA SECONDE N'EST PAS UN CAPRICE.
#
# `workflow_dispatch` est le bouton « Run workflow » de l'onglet Actions — c'est celle qui sert
# au quotidien. GitHub ne l'affiche que pour les workflows présents sur la branche PAR DÉFAUT :
# tant que ce fichier n'est que sur une branche de travail, le bouton n'existe pas et l'API
# répond 404.
#
# En attendant, il part sur les fichiers dont le changement justifie de tout refaire : ce workflow,
# les accroches, et les trois fichiers qui n'existent que pour ces images — le profil de
# démonstration, le test qui photographie, le script qui compose. Modifier l'un d'eux sans
# régénérer les images laisse en ligne une série qui ne dit plus ce que le dépôt dit — et c'est
# exactement comme ça que les six captures publiées se sont retrouvées à dater du 30 août.
#
# LES VUES SONT ENTRÉES DANS LA LISTE, ET C'EST UN COMPROMIS QUI A CHANGÉ DE CAMP.
#
# La version précédente gardait le déclencheur à cinq fichiers pour qu'« une correction de code
# ordinaire ne paie jamais ces vingt minutes », en notant elle-même le prix : « une correction dans
# `ClubView` change ce que la capture montre sans la relancer, et il faut alors toucher l'un des
# cinq ». On y est arrivé, et pas une fois : trente et un garde-fous lisent le code de l'app et
# AUCUN ne peut dire si un écran est beau. Pour tout ce qui touche à `Views` ou à `DesignSystem`,
# l'image EST la vérification — et ne pas l'avoir a coûté plus cher que vingt minutes de machine :
# quatre sections sans carte sont restées en ligne parce que personne ne les avait vues.
#
# Les vingt minutes sont d'ailleurs payées en parallèle de `testflight.yml`, qui part sur le même
# push : le trajet complet ne s'allonge que de l'écart entre les deux.
#
# Les `Models` et les `Services` restent dehors : ils n'ont pas de visage, et leurs défauts se
# lisent dans les tests. Les `ViewModels`, eux, sont entrés — ils décident de ce qu'un écran
# affiche, ce qui est exactement avoir un visage.
#
# PAS D'ÉTIQUETTE `captures-*`, et c'est une correction. La première version en avait une — mais
# un `push` qui déclare `tags:` SANS `branches:` ne part QUE sur une étiquette : la règle de
# GitHub, et la raison pour laquelle le premier essai n'a rien lancé du tout. Garder un
# déclencheur qu'on ne peut pas essayer depuis ici serait garder une promesse non vérifiée.
on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/captures.yml"
      - "appstore/captions.json"
      # Les trois fichiers qui n'existent QUE pour ces images : le profil de démonstration, le
      # test qui photographie, et le script qui compose. Les toucher sans refaire les captures
      # laisse en ligne une série qui ne correspond plus à ce que le dépôt produit — c'est
      # exactement ce qui a fait dater les six captures publiées du 30 août.
      - "RunUp/Services/CaptureSeed.swift"
      - "RunUpUITests/**"
      - "ci_scripts/screenshots.py"
      - "ci_scripts/apercu.py"
      - "ci_scripts/montage.py"
      - "ci_scripts/bascules.py"
      - "appstore/apercu.json"
      # Tout ce qui se juge à l'œil et qu'aucun script ne sait relire.
      - "RunUp/Views/**"
      - "RunUp/DesignSystem/**"
      # ET LES QUATRE ENTRÉES QUI DÉCIDENT DE CE QU'ON VOIT SANS ÊTRE DANS `Views`.
      #
      # `AppState` est le routeur — c'est lui qui dit quel écran est à l'écran, et désormais
      # comment on passe de l'un à l'autre. Le correctif de la transition d'écran n'a touché que
      # lui : les captures ne se sont pas relancées, et je n'ai donc pas pu mesurer ce que le
      # correctif changeait. Un déclencheur qui rate le fichier le plus central de l'app rate
      # sa raison d'être.
      - "RunUp/AppState.swift"
      - "RunUp/AppScreen.swift"
      # `RunUpApp.swift` EST LE SEUL FICHIER HORS DE `Views` ET `DesignSystem` QUI CONTIENNE DES
      # VUES SwiftUI — mesuré, pas supposé : un seul `some View` dans tout le reste de `RunUp/`.
      # Il porte `RootView`, donc la barre d'onglets, les feuilles présentées par-dessus, et le
      # bloc qui pose le profil de démonstration que ces captures photographient. Il manquait.
      # Le commit du rapport de panne l'a touché le 8 novembre 2026 : les captures ne se sont pas
      # relancées, et rien n'aurait dit qu'une vue racine cassée était en ligne.
      - "RunUp/RunUpApp.swift"
      # LES `ViewModels` ONT UN VISAGE, contrairement aux `Models` et aux `Services` (voir
      # ci-dessous). Les six décident de ce qu'au moins cinq écrans photographiés AFFICHENT :
      # `BilanDeLaSemaine` les quatre chiffres du bilan, `CoachViewModel` la conversation,
      # `LiveRunViewModel` les mesures de la course en cours, `PlanRecap` le plan, et
      # `OnboardingViewModel` est lu par dix-huit vues dont celle de la capture « inscription ».
      # Un chiffre faux sur l'écran de course ne casse rien, ne lève aucune alerte, et ne se voit
      # que sur l'image.
      - "RunUp/ViewModels/**"
  workflow_dispatch:
    inputs:
      langues:
        description: "Langues à produire, séparées par des espaces"
        required: true
        type: string
        default: "fr-FR en-US es-ES"
      simulateur:
        description: "Le simulateur — « auto » prend le plus grand iPhone Pro Max disponible"
        required: true
        type: string
        default: "auto"

jobs:
  captures:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "→ Xcode retenu : $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      # Le même script que TestFlight, pour que les deux chaînes produisent le même projet. Sans
      # secret ici : il se contente d'avertir que le coach répondra 401, ce qui n'a aucune
      # importance pour une capture — l'écran du coach est peuplé par l'état de démonstration.
      - name: Préparer le projet
        run: sh ci_scripts/prepare_project.sh

      # Les valeurs par défaut des entrées ne s'appliquent QU'AU bouton : un déclenchement par
      # étiquette les laisse vides, et `xcodebuild -destination "id="` partirait sur rien.
      - name: Choisir langues et simulateur
        id: quoi
        run: |
          set -euo pipefail
          langues="${{ inputs.langues }}"
          simulateur="${{ inputs.simulateur }}"
          echo "langues=${langues:-fr-FR en-US es-ES}" >> "$GITHUB_OUTPUT"
          echo "simulateur=${simulateur:-auto}" >> "$GITHUB_OUTPUT"

      # LE NOM DU SIMULATEUR NE DOIT PAS ÊTRE ÉCRIT EN DUR, ET LE PREMIER ESSAI L'ÉTAIT.
      #
      # Il demandait un « iPhone 16 Pro Max » ; le runner n'avait que des 17, et la série s'est
      # arrêtée à cette ligne. Un an plus tard il n'aura que des 18, et elle s'arrêterait de
      # nouveau au même endroit — pour une raison qui n'a rien à voir avec l'app.
      #
      # On cherche donc le PLUS GRAND iPhone Pro Max disponible, quel que soit son numéro. C'est
      # la bonne question de toute façon : Apple ne demande plus qu'une taille de capture, celle
      # du plus grand iPhone. « Le plus grand » est ce qu'on veut ; un numéro ne l'est jamais.
      #
      # Un nom explicite reste prioritaire quand on en passe un par le bouton — pour photographier
      # un petit écran, par exemple — et il échoue bruyamment s'il n'existe pas.
      - name: Trouver le simulateur
        id: sim
        run: |
          set -euo pipefail
          nom="${{ steps.quoi.outputs.simulateur }}"
          # `-j` puis `jq` plutôt qu'un `grep` sur la sortie lisible : celle-ci change de forme
          # d'une version de Xcode à l'autre, et un `grep` qui ne trouve rien donne un identifiant
          # vide, donc une commande `xcodebuild` qui part sur le mauvais appareil sans rien dire.
          liste=$(xcrun simctl list devices available -j)
          if [ "$nom" = "auto" ]; then
            # Trié par le NUMÉRO du modèle et pas par le nom : « iPhone 9 Pro Max » passerait
            # après « iPhone 17 Pro Max » en ordre alphabétique.
            choisi=$(echo "$liste" | jq -c '
              [.devices[][] | select(.name | test("^iPhone [0-9]+ Pro Max$"))]
              | sort_by(.name | capture("iPhone (?<n>[0-9]+)") | .n | tonumber)
              | last // empty')
            nom=$(echo "$choisi" | jq -r '.name // empty')
            udid=$(echo "$choisi" | jq -r '.udid // empty')
          else
            udid=$(echo "$liste" | jq -r --arg n "$nom" \
              '[.devices[][] | select(.name == $n)] | .[0].udid // empty')
          fi
          if [ -z "$udid" ]; then
            echo "✗ Simulateur « $nom » introuvable. Disponibles :"
            echo "$liste" | jq -r '.devices[][].name' | sort -u
            exit 1
          fi
          echo "→ $nom : $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Construit UNE fois, pour les trois langues. `build-for-testing` sépare la construction de
      # l'exécution : sans ça, chaque langue recompilerait l'app entière, soit trois fois le même
      # travail pour trois lancements qui ne diffèrent que par un argument.
      # `CODE_SIGNING_ALLOWED=NO` N'EST PAS GRATUIT, et ça a coûté quatre exécutions.
      #
      # Sans signature, le binaire ne porte AUCUN droit — pas de `com.apple.developer.healthkit`
      # en particulier. Or `HKSource.default()` ne renvoie pas d'erreur Swift dans ce cas : il
      # lève une exception Objective-C, que Swift ne peut pas rattraper, et le processus meurt
      # sur SIGABRT une seconde après le lancement. Le test voyait « Lost connection to the
      # application » et rien d'autre.
      #
      # `HealthKitService.desactiver()`, tiré par le harnais de captures, est la parade. Si une
      # autre bibliothèque système se met un jour à exiger un droit, ce sera le même symptôme,
      # et l'étape « Dire ce qui a planté » plus bas est le seul endroit où le lire.
      - name: Construire pour les tests
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project RunUp.xcodeproj \
            -scheme Captures \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/captures \
            CODE_SIGNING_ALLOWED=NO

      # Démarré UNE fois, avant la boucle : trois démarrages à froid coûtaient six minutes pour
      # rien. `|| true` sur l'extinction, parce qu'éteindre un appareil déjà éteint est une
      # erreur pour `simctl` et pas pour nous.
      - name: Démarrer le simulateur
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b || true

      - name: Photographier, langue par langue
        run: |
          set -euo pipefail
          for langue in ${{ steps.quoi.outputs.langues }}; do
            echo "──────────── $langue ────────────"
            dossier="$PWD/appstore/raw/$langue"
            rm -rf "$dossier"
            mkdir -p "$dossier"
            # PAS D'EFFACEMENT ENTRE DEUX LANGUES, et c'est une correction.
            #
            # Le premier essai effaçait et redémarrait le simulateur à chaque langue, au cas où
            # le système garderait la langue en cache. Il la garde — mais `-AppleLanguages` est
            # passé en ARGUMENT DE LANCEMENT, ce qui la remplace pour ce processus-là seulement
            # et rend l'effacement inutile. Il coûtait une minute cinquante par langue, se
            # terminait sur un état de démarrage douteux, et l'app, elle, vide sa propre base à
            # chaque lancement (voir `CaptureSeed.poser`).
            # LE PRÉFIXE `TEST_RUNNER_` N'EST PAS DÉCORATIF. Le test tourne dans un
            # processus du SIMULATEUR, qui n'hérite pas de l'environnement du shell :
            # poser `RUNUP_LANG=…` devant `xcodebuild` ne le ferait arriver nulle part, et le
            # test lirait `nil` sans se plaindre — trois séries identiques en français, et
            # aucune erreur pour le dire. `xcodebuild` transmet en revanche toute variable
            # nommée `TEST_RUNNER_X` au lanceur, sous le nom `X`.
            TEST_RUNNER_RUNUP_LANG="$langue" \
            TEST_RUNNER_RUNUP_CAPTURES_DIR="$dossier" \
              xcodebuild test-without-building \
                -project RunUp.xcodeproj \
                -scheme Captures \
                -destination "id=${{ steps.sim.outputs.udid }}" \
                -derivedDataPath build/captures \
                CODE_SIGNING_ALLOWED=NO
            echo "→ $(ls -1 "$dossier" | wc -l | tr -d ' ') capture(s) dans appstore/raw/$langue"
            ls -1 "$dossier"
          done

      # ── LA MÊME SÉRIE EN THÈME CLAIR, ET C'EST ELLE QUI LIVRE ────────────────────────────────
      #
      # Le thème clair n'était photographié qu'en français, après la composition, comme outil de
      # travail — « on vient voir des fonds et des contrastes, pas des traductions ». Les deux
      # moitiés de cette phrase ont cessé d'être vraies le jour où la fiche est passée sur un
      # fond os : ce sont ces captures-là qui partent sur l'App Store, dans les trois langues,
      # et un écran sombre posé sur ce fond ferait six trous noirs.
      #
      # Elle passe donc AVANT la composition, et elle ne peut plus échouer en silence : ce n'est
      # plus une passe de confort, c'est la source de la fiche.
      #
      # La passe sombre reste, et garde son rôle d'origine : c'est elle qui produit le dossier
      # `diagnostic/`, celui qu'on regarde pour juger l'app écran par écran.
      - name: Photographier la série claire, langue par langue
        run: |
          set -euo pipefail
          for langue in ${{ steps.quoi.outputs.langues }}; do
            echo "──────────── $langue · clair ────────────"
            dossier="$PWD/appstore/raw/$langue"
            rm -rf "$dossier/clair"
            TEST_RUNNER_RUNUP_LANG="$langue" \
            TEST_RUNNER_RUNUP_CAPTURES_DIR="$dossier" \
            TEST_RUNNER_RUNUP_CAPTURES_CLAIR="1" \
              xcodebuild test-without-building \
                -project RunUp.xcodeproj \
                -scheme Captures \
                -destination "id=${{ steps.sim.outputs.udid }}" \
                -derivedDataPath build/captures \
                CODE_SIGNING_ALLOWED=NO
            echo "→ $(ls -1 "$dossier/clair" | wc -l | tr -d ' ') capture(s) dans appstore/raw/$langue/clair"
          done

      # DIRE POURQUOI, PLUTÔT QUE DE DEVINER.
      #
      # Deux séries ont été diagnostiquées à l'aveugle — « Lost connection to the application »,
      # puis « crashed in <external symbol> » — en raisonnant sur ce que le code POURRAIT faire.
      # Le simulateur écrit pourtant un rapport de plantage complet sur le disque de la machine,
      # avec la pile d'appels et la ligne fautive. Il suffisait de le lire.
      - name: Dire ce qui a planté
        if: failure()
        run: |
          set +e
          echo "────────── rapports de plantage ──────────"
          dossier=~/Library/Logs/DiagnosticReports
          rapports=$(ls -t "$dossier"/RunUp*.ips 2>/dev/null | head -2)
          if [ -z "$rapports" ]; then
            echo "(aucun rapport pour RunUp dans $dossier)"
            ls -t "$dossier" 2>/dev/null | head -10
          fi
          # LE MESSAGE D'UN `fatalError` N'EST PAS DANS LE RAPPORT .ips.
          #
          # Le rapport donne la pile — `_assertionFailure` ← `CaptureSeed.poserLeClub`, ligne
          # 250 — et c'est déjà beaucoup. Mais la PHRASE, celle qui nomme le champ fautif, part
          # sur la sortie d'erreur, donc dans le journal du simulateur. Sans elle il a fallu
          # relire le décodeur à la main pour trouver que le tracé voyageait en paires.
          echo "────────── journal du simulateur ──────────"
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show \
            --last 10m --style compact \
            --predicate 'processImagePath CONTAINS "RunUp"' 2>/dev/null \
            | grep -iE "fatal error|precondition|assert" | head -20 || true

          for r in $rapports; do
            echo "── $r"
            # Les .ips font plusieurs milliers de lignes de registres et de bibliothèques
            # chargées. Ce qui sert tient dans les cent premières : le type d'exception, la
            # raison, et le haut de la pile du fil fautif.
            head -c 20000 "$r"
            echo
          done

      # UN ENVIRONNEMENT VIRTUEL, PAS UN `pip install` NU.
      #
      # `python3 -m pip install pillow` est maintenant REFUSÉ sur les runners macOS :
      # « error: externally-managed-environment » (PEP 668). Le Python de Homebrew protège ses
      # paquets, et l'exécution 5 est morte là — après avoir produit les dix-huit captures, à la
      # toute dernière étape. `--break-system-packages` passerait, au prix d'abîmer
      # l'installation Homebrew du runner ; un environnement virtuel ne touche à rien.
      #
      # `--system-site-packages` pour ne pas réinstaller ce qui est déjà là.
      - name: Composer les images finales
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pillow
          for langue in ${{ steps.quoi.outputs.langues }}; do
            echo "──────────── $langue ────────────"
            "$RUNNER_TEMP/venv/bin/python" ci_scripts/screenshots.py "$langue"
          done

      # ── LE GRAND TEXTE A-T-IL PRIS ? ─────────────────────────────────────────────────────────
      #
      # Quatre captures nouvelles montrent l'app au deuxième cran d'accessibilité (AX2, ≈1,94 ×,
      # le plus grand que le plafond de 2,0 × de `RUFont` couvre en entier). Elles existent parce
      # que le relèvement de ce plafond, de 1,6 × à 2,0 ×, s'appuyait sur un travail de
      # réorganisation ÉCRIT et jamais photographié.
      #
      # Et une capture verte ne prouve que deux choses : l'app n'a pas planté, un fichier a été
      # écrit. Si `-UIPreferredContentSizeCategoryName` cessait d'être lu, les quatre images
      # seraient des copies des captures ordinaires et le harnais resterait vert. On mesure donc
      # l'écart entre chaque image et son ordinaire.
      #
      # LE PLANCHER EST POSÉ, ET IL VIENT DE DEUX RELEVÉS.
      #
      # Trente-six mesures — trois exécutions complètes, trois langues, quatre écrans — vont de
      # 16,2 à 31,3. La plus basse est la course en cours en anglais, et elle a BAISSÉ le
      # 8 novembre : les trois mesures de cet écran ne se cassent plus en deux, donc l'écran en
      # grand texte ressemble un peu plus à l'ordinaire qu'avant. Le bas de la distribution est
      # donc connu, et il bouge quand on corrige — raison de plus pour ne pas le serrer.
      #
      # 10 est le plancher : sous la plus basse observée d'un facteur 1,6, et très au-dessus de
      # ce que rendrait le défaut qu'on veut attraper. Si
      # `-UIPreferredContentSizeCategoryName` cessait d'être lu — un renommage chez Apple, un
      # drapeau mal orthographié — les quatre images seraient des COPIES des captures
      # ordinaires et l'écart tomberait à la fraction de point que laisse l'horloge. Il n'y a
      # rien entre 0,x et 17 à départager, donc rien à régler finement.
      - name: Le grand texte a-t-il pris, langue par langue
        run: |
          set -euo pipefail
          cd ci_scripts && "$RUNNER_TEMP/venv/bin/python" test_grand_texte.py
          cd ..
          for langue in ${{ steps.quoi.outputs.langues }}; do
            echo "──────────── $langue · grand texte ────────────"
            "$RUNNER_TEMP/venv/bin/python" ci_scripts/check_grand_texte.py \
              --dossier "appstore/raw/$langue" --plancher 10
          done

      # ── L'APERÇU VIDÉO, FILMÉ PAR LA MACHINE ─────────────────────────────────────────────────
      #
      # `appstore/APERCU.md` décrit la façon d'avant : filmer un iPhone à la main, six plans d'une
      # traite, raccourcir dans Photos pour tenir sous les 25 Mo que GitHub accepte depuis un
      # navigateur, déposer le fichier, lancer un second workflow. À refaire par langue, et à
      # refaire en entier dès qu'un écran change.
      #
      # Ce qui se refait à la main ne se refait pas. C'est ce qui était arrivé aux captures — en
      # ligne depuis le 30 août dans l'ancien rose — avant que la machine ne les reprenne. Un
      # aperçu qui montre une version de l'app qui n'existe plus est pire que pas d'aperçu.
      #
      # Le simulateur est déjà démarré, l'app déjà construite : il ne manquait que de le filmer
      # pendant qu'un test le pilote. Voir `RunUpUITests/ApercuUITests`.
      #
      # ffmpeg n'est pas livré avec les machines macOS — il l'est avec les Ubuntu, d'où la
      # répartition d'origine. On l'installe donc ici, et c'est le seul coût ajouté.
      - name: Installer ffmpeg
        run: brew install ffmpeg

      # LE COMPTEUR EST ÉPROUVÉ AVANT DE SERVIR, sur un film fabriqué dont on connaît le défaut
      # à l'image près. Un compteur d'images vides qui se trompe est pire que pas de compteur :
      # il dirait « zéro » sur un écran qui clignote, et on le croirait. Trois images de fond nu
      # sont plantées dans le film d'essai ; le test vérifie qu'il en trouve trois.
      #
      # Ici et pas dans `testflight.yml` : il demande ffmpeg, qui vient d'être installé, et il
      # prend quelques secondes.
      - name: Éprouver la mesure des bascules
        run: cd ci_scripts && "$RUNNER_TEMP/venv/bin/python" test_bascules.py

      # LE DÉCOUPAGE D'UN ÉCRAN PHOTOGRAPHIÉ NE DOIT RIEN CHANGER À L'IMAGE, et cette chaîne-ci
      # ne le vérifie pas : son vert dit que l'app n'a pas planté et qu'un fichier a été écrit.
      # `comparer.py` compare deux jeux de captures et dit ce qui a bougé — écart moyen, nombre
      # de pixels, cadre qui les contient, barre d'état masquée parce qu'elle porte l'heure. Il
      # prend des dossiers en arguments, donc il ne tourne pas tout seul : ce sont ses cas qui
      # tournent, et ils éprouvent le seul endroit où l'outil pourrait mentir utilement — une
      # moyenne basse sur un petit bloc changé du tout au tout.
      #
      # ICI ET PAS DANS `testflight.yml`, POUR LA MÊME RAISON QUE LE TEST AU-DESSUS : il lit des
      # images, donc il demande Pillow, et c'est ce venv qui le porte. Je l'avais mis dans
      # TestFlight ; le runner macOS a répondu `ModuleNotFoundError: No module named 'PIL'` dix
      # minutes plus tard. Les huit scripts du dépôt qui lisent des images sont tous ici.
      - name: Éprouver la comparaison de captures
        run: cd ci_scripts && "$RUNNER_TEMP/venv/bin/python" test_comparer.py

      - name: Filmer l'aperçu, langue par langue
        run: |
          set -euo pipefail
          rm -rf appstore/apercu/out
          for langue in ${{ steps.quoi.outputs.langues }}; do
            echo "──────────── $langue · aperçu ────────────"
            dossier="$PWD/appstore/apercu/$langue"
            rm -rf "$dossier"; mkdir -p "$dossier"

            # L'HEURE DU DÉPART DE LA CAMÉRA — CELLE DE LA CAMÉRA, PAS CELLE DE L'APPEL.
            #
            # Les deux sont séparées de TROIS SECONDES : `simctl` attache le simulateur, choisit
            # l'écran, ouvre le fichier, et seulement ensuite enregistre. Pendant plusieurs
            # exécutions, l'heure était prise avant tout ça, et le film était donc coupé trois
            # secondes trop tard : sous chaque titre l'écran du plan SUIVANT, et pour finir
            # l'écran d'accueil du simulateur à la place du dernier plan.
            #
            # Mesuré sur l'enregistrement brut, sur les huit bascules d'onglet d'une prise :
            # écart constant de −3,17 s, étendue 0,7 s sur trente-cinq secondes. Un retard au
            # démarrage, donc, et non une dérive — une première correction l'avait pris pour une
            # différence de rythme entre les deux horloges et mettait les repères à l'échelle,
            # ce qui déplaçait le découpage dans l'autre sens.
            #
            # `simctl` dit « Recording started » quand il commence. On l'attend, et on horodate
            # cette ligne-là. Trente secondes de patience au plus : au-delà, on prend l'heure
            # courante et on le dit, plutôt que de laisser le travail suspendu.
            xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo \
              --codec h264 --force "$dossier/brut.mov" > "$dossier/camera.log" 2>&1 &
            camera=$!
            depart=""
            for _ in $(seq 1 300); do
              if grep -q "Recording started" "$dossier/camera.log" 2>/dev/null; then
                depart=$(python3 -c "import time; print(time.time())")
                break
              fi
              sleep 0.1
            done
            if [ -z "$depart" ]; then
              echo "⚠︎ la caméra n'a pas annoncé qu'elle tournait — heure prise à l'aveugle"
              depart=$(python3 -c "import time; print(time.time())")
            fi

            TEST_RUNNER_RUNUP_LANG="$langue" \
            TEST_RUNNER_RUNUP_APERCU="1" \
            TEST_RUNNER_RUNUP_APERCU_DIR="$dossier" \
              xcodebuild test-without-building \
                -project RunUp.xcodeproj \
                -scheme Captures \
                -destination "id=${{ steps.sim.outputs.udid }}" \
                -derivedDataPath build/captures \
                -only-testing:RunUpUITests/ApercuUITests \
                CODE_SIGNING_ALLOWED=NO

            # TROIS SECONDES DE RAB AVANT DE COUPER, et une seconde et demie ne suffisait pas.
            #
            # `xcodebuild` rend la main dès le test fini, et `simctl` n'écrit pas la toute fin de
            # son tampon. Au premier essai, sans rab, le dernier plan ne faisait qu'UNE IMAGE ;
            # avec une seconde et demie, il en manquait encore 0,38 s — le garde-fou du montage
            # l'a nommé, ce pour quoi il existe. Trois secondes couvrent largement.
            sleep 3
            # `-INT` et non `-KILL` : `simctl` ferme alors proprement le fichier. Tué net, il
            # laisse un .mov sans index, que ffmpeg lit mal ou pas du tout.
            kill -INT "$camera"
            wait "$camera" || true

            # LE DÉBUT ET LA FIN VIENNENT DU TEST, PAS D'UNE ESTIMATION.
            #
            # Le test écrit l'heure qu'il est au moment où la prise commence et au moment où elle
            # s'arrête. La caméra, elle, tourne avant (installation, lancement) et après
            # (démontage du test). Sans ces deux marques, le premier essai a rendu trente
            # secondes pile — le plafond d'Apple, pas une fin : le dernier plan était hors champ
            # et la vidéo s'achevait sur ce qui traînait derrière.
            # LE DÉCALAGE ENTRE LA CAMÉRA ET LA PRISE. La première tourne pendant l'installation
            # et le lancement de l'app ; la seconde commence quand l'app est à l'écran, et le
            # test écrit l'heure qu'il est à ce moment-là. Les temps du découpage comptent depuis
            # là : sans ce décalage, le montage irait chercher ses plans dans l'écran d'accueil
            # du simulateur.
            lance=$(cat "$dossier/debut.txt")
            decalage=$(python3 -c "print(max(0.0, $lance - $depart))")
            bandeau=$(python3 -c "import json,sys; print(json.load(open('appstore/captions.json'))[sys.argv[1]]['bandeau'])" "$langue")
            echo "→ prise à $decalage s après le début de l'enregistrement"

            # COMBIEN D'IMAGES VIDES À CHAQUE CHANGEMENT D'ONGLET.
            #
            # Le trou du Coach — barre d'onglets en place, contenu pas encore — a été compté à la
            # main une fois : trois images, 0,10 s. Une main ne recompte pas à chaque commit, et
            # le trou se reformera le jour où quelqu'un changera d'écran sans animer la mutation.
            # C'est exactement ce qui était arrivé : la transition était écrite, commentée, et ne
            # jouait pas.
            #
            # L'enregistrement brut contient les quatre bascules et le test en a relevé l'heure :
            # il n'y a rien à filmer en plus, juste à compter dans ce qui est déjà là. Et c'est
            # gratuit — la mesure lit un fichier qui existe déjà et qu'on jette ensuite.
            #
            # LE PLAFOND EST POSÉ, ET IL VIENT D'UN RELEVÉ. Vingt-quatre bascules mesurées —
            # trois langues, deux passes, quatre onglets — rendent TOUTES zéro image vide. Le
            # plafond est donc 1 : une image de marge pour un classement limite, et le trou de
            # trois images qu'on vient de corriger ne repasserait pas.
            #
            # DEUX RELEVÉS, ET LE PREMIER EST CELUI QUI COMPTE. Le test ouvre chaque onglet une
            # fois avant la prise, pour que l'aperçu montre l'app telle qu'on la voit au
            # quotidien ; le défaut, lui, est à la PREMIÈRE ouverture. Mesurer la prise seule,
            # c'est mesurer l'app une fois le trou passé, et conclure qu'il n'y en a pas.
            #
            # ET ELLE PASSE AVANT LE MONTAGE, parce qu'elle vérifie aussi que chaque bascule
            # tombe sur l'écran qu'elle vise — en la confrontant aux captures que la passe
            # claire vient de prendre. C'est le contrôle qui manquait : un découpage décalé de
            # trois secondes met chaque plan sur l'écran suivant, et aucune durée ne peut le
            # dire. Mesuré sur une prise réelle, l'écart au bon écran vaut 4,8 et au plus proche
            # des autres 24 : il n'y a pas de seuil à régler.
            #
            # Si le découpage est faux, on ne fabrique pas le film. Les images, elles, sont
            # déjà composées et partent quand même.

            # L'ALIGNEMENT, UNE FOIS, AVANT LES DEUX MESURES.
            #
            # La recherche coûte 132 extractions d'image ; les deux mesures qui suivent se
            # repèrent sur le même enregistrement et la même horloge, donc elles partagent le
            # décalage trouvé. Le chercher deux fois coûterait deux minutes par langue pour le
            # même nombre.
            mesure="$dossier/alignement.txt"
            "$RUNNER_TEMP/venv/bin/python" ci_scripts/bascules.py \
              --entree "$dossier/brut.mov" \
              --temps "$dossier/temps.json" \
              --decalage "$decalage" \
              --temoins "appstore/raw/$langue/clair" \
              --aligner --seulement-aligner | tee "$mesure"
            aligne=$(sed -n 's/^DÉCALAGE=//p' "$mesure" | tail -1)
            if [ -n "$aligne" ]; then
              echo "→ découpage et film coupés sur $aligne s (la caméra annonçait $decalage s)"
              decalage="$aligne"
            fi

            echo "— première ouverture de chaque onglet —"
            "$RUNNER_TEMP/venv/bin/python" ci_scripts/bascules.py \
              --entree "$dossier/brut.mov" \
              --temps "$dossier/prechauffage.json" \
              --decalage "$decalage" \
              --temoins "appstore/raw/$langue/clair" \
              --preuves "$dossier/preuves" \
              --plafond 1
            # L'ALIGNEMENT VIENT DU CONTENU, ET LE MONTAGE COUPE DESSUS.
            #
            # L'heure annoncée par `simctl` est juste la plupart du temps, et parfois non : deux
            # films ont été refusés par le garde-fou, un en espagnol le 7 novembre, un en anglais
            # le 8, et les images gardées montrent le même symptôme — chaque plan sur l'écran du
            # plan SUIVANT, soit un retard d'environ trois secondes.
            #
            # Les quatre écrans visés sont photographiés par la passe claire. On essaie donc des
            # décalages et on garde celui qui met les quatre plans sur leurs écrans. La dernière
            # ligne de la mesure le porte ; `tee` garde l'affichage dans le journal.
            echo "— deuxième ouverture, celle que montre le film —"
            "$RUNNER_TEMP/venv/bin/python" ci_scripts/bascules.py \
              --entree "$dossier/brut.mov" \
              --temps "$dossier/temps.json" \
              --decalage "$decalage" \
              --temoins "appstore/raw/$langue/clair" \
              --preuves "$dossier/preuves" \
              --plafond 1

            # LE MONTAGE, une fois le découpage vérifié.
            #
            # `apercu.py` conformait l'enregistrement au format d'Apple et s'arrêtait là : on
            # envoyait un film de quelqu'un qui tapote des onglets. `montage.py` en fait la
            # fiche animée — même fond, même châssis, même police, mêmes filets, même ligne
            # courante — et coupe plan par plan sur le découpage que le test vient de relever.
            "$RUNNER_TEMP/venv/bin/python" ci_scripts/montage.py \
              --entree "$dossier/brut.mov" \
              --sortie "$PWD/appstore/apercu/out/$langue.mp4" \
              --temps "$dossier/temps.json" \
              --textes appstore/apercu.json \
              --langue "$langue" \
              --bandeau "$bandeau" \
              --decalage "$decalage"
          done
          ls -la appstore/apercu/out

      # Les brutes ET les composées. Les premières pour pouvoir juger ce que la machine a vu, les
      # secondes pour les déposer telles quelles dans App Store Connect.
      # `always()` : un montage raté ne doit pas emporter les images avec lui. Elles sont la
      # livraison principale, elles sont déjà composées à ce stade, et les perdre pour une vidéo
      # trop courte obligerait à refaire quarante minutes de harnais pour rien.
      # LES ENREGISTREMENTS BRUTS NE SONT PLUS PUBLIÉS, L'ALIGNEMENT EST CONFIRMÉ.
      #
      # Ils ont servi une fois, et bien : c'est en les relisant qu'on a vu que la caméra démarre
      # trois secondes après qu'on la lance. Trente mégaoctets par langue à chaque exécution
      # pour une vérification qui est désormais faite par la machine, à chaque film, contre les
      # captures de la passe claire — autant les laisser sur le disque du runner.
      #
      # Les repères, eux, restent : ils pèsent un kilo-octet et disent ce que le test a vu.
      #
      # ET L'IMAGE JUGÉE PART, MAIS SEULEMENT QUAND LE VERDICT EST MAUVAIS. Le garde-fou a dit
      # « ce plan montre le mauvais écran » sur l'espagnol, une fois, et il ne restait rien à
      # regarder : ni le brut, ni le gris réduit sur lequel il s'était prononcé. Un verdict sans
      # pièce ne se vérifie pas. `--preuves` garde donc l'image de l'instant jugé, en entier —
      # quelques centaines de kilo-octets, et rien du tout quand tout va bien.
      #
      # (Le commentaire est ici et non dans la liste : dans un bloc littéral `|`, un dièse n'est
      # pas un commentaire, c'est une ligne de chemin de plus.)
      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-app-store
          path: |
            appstore/raw/**
            appstore/out/**
            appstore/apercu/out/**
            appstore/apercu/*/*.json
            appstore/apercu/*/debut.txt
            appstore/apercu/*/preuves/*.png
          if-no-files-found: error
          retention-days: 30
