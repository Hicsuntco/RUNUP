# La fiche App Store, pilotée depuis GitHub.
#
# Les trois secrets nécessaires — `ASC_KEY_ID`, `ASC_ISSUER_ID`, `ASC_KEY_P8` — sont déjà là :
# c'est la même clé d'API qui envoie les builds sur TestFlight. Rien de plus à installer, aucun
# fichier `.p8` à retrouver sur une machine, et rien à taper dans un terminal.
#
# Onglet **Actions** → **App Store** → **Run workflow** → choisir l'action.

name: App Store

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Que faire"
        required: true
        type: choice
        default: status
        options:
          - status
          - creer-la-version
          - pousser-la-fiche-essai
          - pousser-la-fiche
          - composer-les-captures
          - pousser-les-captures-essai
          - pousser-les-captures
          - pourquoi-pas-soumettable
          - liberer-la-file
          - pousser-la-montre
          - lister-les-captures
          - nettoyer-les-captures-essai
          - nettoyer-les-captures
          - pousser-l-apercu-essai
          - pousser-l-apercu
          - assembler-l-apercu
          - etat-des-builds
          - soumettre-essai
          - soumettre
          - codes-promo
          - codes-promo-essai
          - codes-promo-creer
          - remplacer-la-build
      version:
        description: "Numéro de version (doit correspondre à CFBundleShortVersionString)"
        required: true
        type: string
        default: "2.6"
      build:
        description: "Numéro de build à attacher (pour soumettre ; vide = la plus récente VALID)"
        required: false
        type: string
        default: ""
      langue:
        description: "Langue des accroches (pour composer-les-captures)"
        required: true
        type: choice
        default: fr-FR
        options:
          - fr-FR
          - en-US
          - es-ES
      captures:
        description: "Nº d'exécution « Captures App Store » d'où prendre les images (vide = la dernière réussie)"
        required: false
        type: string
        default: ""
      debut:
        description: "Secondes à sauter au début de l'enregistrement (pour assembler-l-apercu)"
        required: false
        type: string
        default: "0"
      retirer:
        description: "Formats de capture à SUPPRIMER (pour nettoyer-les-captures), séparés par des espaces"
        required: false
        type: string
        default: ""
      branche:
        description: "Branche où lire la fiche et le script"
        required: true
        type: string
        default: "claude/runup-ios-swiftui-app-5b1yv6"

# Deux exécutions en parallèle écriraient la même fiche depuis deux états différents.
concurrency: appstore

jobs:
  appstore:
    runs-on: ubuntu-latest
    steps:
      # Ce fichier vit sur `main` — GitHub n'affiche le bouton « Run workflow » que pour les
      # workflows présents sur la branche par défaut. Mais `main` ne contient QUE le serveur :
      # ni `ci_scripts/asc.py`, ni `APP_STORE_LISTING.md`. On récupère donc explicitement la
      # branche qui les porte, au lieu de compter sur celle depuis laquelle on a cliqué.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}

      # Échouer ici avec une phrase claire, plutôt que dans une erreur HTTP d'Apple vingt lignes
      # plus bas. Un secret vide se crée sans bruit — `gh secret set` accepte une entrée vide —
      # et c'est déjà arrivé deux fois sur ce dépôt.
      - name: Vérifier les secrets
        if: inputs.action != 'composer-les-captures' && inputs.action != 'assembler-l-apercu'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!n:-}" ]; then
              echo "::error::Le secret $n est vide ou absent."
              exit 1
            fi
          done
          printf '%s' "$ASC_KEY_P8" | base64 -d > /tmp/key.p8
          if ! head -1 /tmp/key.p8 | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::ASC_KEY_P8 ne contient pas une clé PEM une fois décodé."
            exit 1
          fi
          echo "Trois secrets présents, clé décodable."

      - name: Installer la clé d'API
        if: inputs.action != 'composer-les-captures' && inputs.action != 'assembler-l-apercu'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"

      # Le même piège que dans `captures.yml` : `pip install` dans le Python du système est
      # refusé (PEP 668, « externally-managed-environment »). L'environnement virtuel est posé
      # DEVANT le PATH des étapes suivantes, pour que les `python3 …` d'après y trouvent Pillow
      # sans avoir à nommer un chemin.
      - name: Installer Pillow
        # Aussi pour l'ENVOI des captures, pas seulement pour leur composition : l'étape qui
        # vérifie les bannières, plus bas, lit des images.
        if: inputs.action == 'composer-les-captures' || startsWith(inputs.action, 'pousser-les-captures')
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet Pillow
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # FFMPEG N'EST PLUS SUR LES RUNNERS UBUNTU, et ce commentaire disait le contraire.
      #
      # Il l'a été, l'image 24.04 ne le porte plus, et l'essai d'envoi de l'aperçu s'est arrêté
      # sur « ffprobe est introuvable ». C'est le bon arrêt — la commande mesure le film avant
      # d'en parler à Apple — mais il valait mieux installer l'outil que supprimer la mesure.
      #
      # Une quarantaine de secondes, et seulement pour les deux actions qui touchent à la vidéo.
      - name: Installer ffmpeg
        if: inputs.action == 'assembler-l-apercu' || startsWith(inputs.action, 'pousser-l-apercu')
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      # On éprouve le découpage avant de s'en servir : un aperçu refusé par App Store Connect ne
      # dit pas laquelle des cinq contraintes a sauté, alors autant que les décisions qui y
      # mènent soient testées.
      - name: Vérifier le découpage de l'aperçu
        if: inputs.action == 'assembler-l-apercu'
        run: cd ci_scripts && python3 test_apercu.py

      # Et pour l'envoi, le même principe : ce que la commande décide SANS parler à Apple —
      # durée, cadence, taille d'image, poids — est éprouvé sur de vrais fichiers juste avant.
      - name: Éprouver les règles de l'aperçu
        if: startsWith(inputs.action, 'pousser-l-apercu')
        run: cd ci_scripts && python3 test_asc_captures.py

      # LES IMAGES NE SONT PAS DANS LE DÉPÔT — `appstore/out/` est ignoré par git, et c'est
      # juste : dix-huit PNG de 900 ko regénérés à chaque changement d'accroche n'ont rien à
      # faire dans un historique. Elles vivent dans l'artéfact de « Captures App Store », qu'on
      # va chercher ici. Sans numéro d'exécution, on prend la dernière réussie de la branche —
      # ce qu'on veut dans le cas courant, « je viens de les refaire ».
      - name: Récupérer les images composées
        if: startsWith(inputs.action, 'pousser-les-captures') || startsWith(inputs.action, 'pousser-l-apercu')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.captures }}
          BRANCHE: ${{ inputs.branche }}
        run: |
          set -euo pipefail
          if [ -z "${RUN:-}" ]; then
            RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/captures.yml/runs?status=success&branch=$BRANCHE&per_page=1" \
                    --jq '.workflow_runs[0].id')
            echo "→ dernière exécution réussie : $RUN"
          fi
          [ -n "$RUN" ] && [ "$RUN" != "null" ] || { echo "::error::Aucune exécution de captures trouvée"; exit 1; }
          # DANS UN DOSSIER NEUF, ET PAS DANS LA COPIE DE TRAVAIL. `appstore/raw/fr-FR/` porte
          # encore quatre captures prises à la main et versionnées : l'extraction tombait
          # dessus avec « error extracting raw/fr-FR/1-accueil.png: file exists ».
          rm -rf "$RUNNER_TEMP/captures"
          gh run download "$RUN" --repo "${{ github.repository }}" --name captures-app-store \
            --dir "$RUNNER_TEMP/captures"
          echo "→ dossiers reçus :"
          ls -1 "$RUNNER_TEMP/captures/out"
          # Les films vivent dans le même artéfact, à côté des images : c'est la même exécution
          # de « Captures App Store » qui les a produits, à partir de la même app.
          ls -1 "$RUNNER_TEMP/captures/apercu/out" 2>/dev/null || echo "  (pas de film)"

      # ON VÉRIFIE CE QU'ON PUBLIE, PAS CE QU'UNE AUTRE CHAÎNE A VÉRIFIÉ.
      #
      # `captures.yml` refuse déjà une bannière du système posée sur une capture (voir son étape
      # « Une bannière du système s'est-elle posée sur une capture »). Mais c'est ICI qu'on parle
      # à Apple, et cette étape-ci télécharge l'artefact d'une exécution qu'on peut DÉSIGNER par
      # son numéro — y compris une exécution antérieure au contrôle, ou simplement ancienne.
      # Sans jeton d'API et sans parler à Apple : quelques secondes de Python sur des images
      # déjà sur le disque. C'est le même principe que l'étape « Éprouver les règles de
      # l'aperçu » juste au-dessus — ce que la commande décide sans parler à Apple est éprouvé
      # sur de vrais fichiers, juste avant.
      #
      # Sur `raw/` et non sur `out/` : le plafond est calibré sur des captures d'app en thème
      # sombre, et les images composées portent un fond de fiche clair où la mesure ne voudrait
      # rien dire. Une bannière dans une brute se retrouve de toute façon dans la composée.
      # Les images exigées par Apple en plus des six de l'iPhone. Ce contrôle est le seul
      # endroit où une image composée d'une capture PÉRIMÉE se voit — et c'est ici qu'il compte,
      # juste avant que la fiche parte.
      - name: Les captures exigées montrent-elles l'app d'aujourd'hui
        run: python3 ci_scripts/check_requis.py

      - name: Une bannière du système s'est-elle posée sur ces captures
        if: startsWith(inputs.action, 'pousser-les-captures')
        run: |
          set -euo pipefail
          cd ci_scripts && python3 test_banniere.py
          cd .. && python3 ci_scripts/check_banniere.py \
            --dossier "$RUNNER_TEMP/captures/raw" --plafond 25
      - name: Exécuter
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
          DEBUT: ${{ inputs.debut }}
          LANGUE: ${{ inputs.langue }}
          BUILD: ${{ inputs.build }}
          WHAT: ${{ inputs.action }}
          RETIRER: ${{ inputs.retirer }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          # Un champ laissé vide ne doit pas devenir « --build  » : l'option prend alors le mot
          # suivant comme valeur, ou fait échouer argparse selon sa position.
          BUILD_OPT=""
          [ -n "${BUILD:-}" ] && BUILD_OPT="--build $BUILD"
          case "$WHAT" in
            status)                   python3 ci_scripts/asc.py status ;;
            creer-la-version)         python3 ci_scripts/asc.py create-version "$VERSION" ;;
            pousser-la-fiche-essai)   python3 ci_scripts/asc.py push-metadata "$VERSION" --dry-run ;;
            pousser-la-fiche)         python3 ci_scripts/asc.py push-metadata "$VERSION" ;;
            composer-les-captures)    python3 ci_scripts/screenshots.py "$LANGUE" ;;
            pousser-les-captures-essai) python3 ci_scripts/asc.py push-screenshots "$VERSION" --dir "$RUNNER_TEMP/captures/out" --dry-run ;;
            pousser-les-captures)     python3 ci_scripts/asc.py push-screenshots "$VERSION" --dir "$RUNNER_TEMP/captures/out" ;;
            pourquoi-pas-soumettable) python3 ci_scripts/asc.py pret "$VERSION" ;;
            liberer-la-file)          python3 ci_scripts/asc.py liberer ;;
            lister-les-captures)      python3 ci_scripts/asc.py list-screenshots "$VERSION" ;;
            nettoyer-les-captures-essai) python3 ci_scripts/asc.py prune-screenshots "$VERSION" --retirer $RETIRER --dry-run ;;
            nettoyer-les-captures)    python3 ci_scripts/asc.py prune-screenshots "$VERSION" --retirer $RETIRER ;;
            pousser-la-montre)        python3 ci_scripts/asc.py push-screenshots "$VERSION" --dir appstore/requis/montre ;;
            pousser-l-apercu-essai)   python3 ci_scripts/asc.py push-previews "$VERSION" --dir "$RUNNER_TEMP/captures/apercu/out" --dry-run ;;
            pousser-l-apercu)         python3 ci_scripts/asc.py push-previews "$VERSION" --dir "$RUNNER_TEMP/captures/apercu/out" ;;
            assembler-l-apercu)       python3 ci_scripts/apercu.py --debut "${DEBUT:-0}" ;;
            etat-des-builds)          python3 ci_scripts/asc.py ci ;;
            soumettre-essai)          python3 ci_scripts/asc.py submit "$VERSION" $BUILD_OPT --dry-run ;;
            soumettre)                python3 ci_scripts/asc.py submit "$VERSION" $BUILD_OPT ;;
            remplacer-la-build)       python3 ci_scripts/asc.py submit "$VERSION" $BUILD_OPT --replace ;;
            codes-promo)              python3 ci_scripts/asc.py promo ;;
            codes-promo-essai)        python3 ci_scripts/asc.py promo-create --dry-run ;;
            codes-promo-creer)        python3 ci_scripts/asc.py promo-create ;;
            *) echo "::error::Action inconnue : $WHAT"; exit 1 ;;
          esac

      - name: Récupérer l'aperçu
        if: inputs.action == 'assembler-l-apercu'
        uses: actions/upload-artifact@v4
        with:
          name: apercu
          path: appstore/apercu/out/apercu.mp4
          if-no-files-found: error

      - name: Récupérer les captures
        if: inputs.action == 'composer-les-captures'
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ inputs.langue }}
          path: appstore/out/${{ inputs.langue }}/
          if-no-files-found: error

      # La clé ne doit pas survivre au job, même si une étape précédente a échoué.
      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" /tmp/key.p8
