<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B10">
<title>Un club sur RUNUP</title>
<!--
  LA PAGE PUBLIQUE D'UN CLUB.

  Un crew recrute sur Instagram et par le bouche-à-oreille, pas dans un moteur de recherche
  interne. Jusqu'ici, on ne pouvait découvrir un club qu'en tapant son nom DANS l'app — c'est-à-
  dire après l'avoir installée, créé un compte, et su qu'il existait. Cette page est le lien
  qu'on met dans une bio.

  Statique, et c'est délibéré : le plan Vercel du projet autorise douze fonctions serverless et
  en compte exactement douze. Elle lit son club avec un seul appel JSON (`api/clubs/public`, le
  seul point d'entrée sans jeton du serveur), ce qui ne coûte aucune fonction de plus.

  Les polices de l'app n'existent pas ici : la pile système suffit, et elle se charge
  instantanément — ce qui compte davantage sur une page ouverte depuis une story en 4G.
-->
<style>
  :root {
    --bg: #0B0B10;
    --card: #15151C;
    --line: #26262F;
    --text: #FFFFFF;
    --text2: #A8A8B3;
    --text3: #72727E;
    --rose: #F50D7A;
    --rose2: #FF4D9D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 560px; margin: 0 auto; padding: 0 20px 64px; }
  /* 16:6 comme dans l'app : une bande, pas une photo — elle ne doit pas pousser le nom du club
     sous la ligne de flottaison. */
  .cover {
    width: 100%; aspect-ratio: 16 / 6; object-fit: cover;
    border-radius: 18px; display: block; margin-top: 20px; background: var(--card);
  }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 22px 0 6px; letter-spacing: -0.01em; }
  .meta { color: var(--text2); font-size: .95rem; margin: 0 0 14px; }
  .desc { color: var(--text2); margin: 0 0 26px; }
  h2 {
    font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text3); margin: 32px 0 12px; font-weight: 700;
  }
  .seance { padding: 14px 0; border-top: 1px solid var(--line); }
  .seance:last-child { border-bottom: 1px solid var(--line); }
  .quand { color: var(--rose2); font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .quand .repete { color: var(--text3); margin-left: 8px; }
  .titre { font-weight: 600; margin: 3px 0 2px; }
  .lieu, .venus { color: var(--text3); font-size: .85rem; }
  .cta {
    display: block; text-align: center; text-decoration: none;
    background: var(--rose); color: #fff; font-weight: 700;
    padding: 16px; border-radius: 999px; margin-top: 32px;
  }
  .note { color: var(--text3); font-size: .82rem; text-align: center; margin-top: 14px; }
  .etat { color: var(--text3); padding: 80px 0; text-align: center; }
  footer { color: var(--text3); font-size: .78rem; text-align: center; margin-top: 48px; }
  footer a { color: var(--text3); }
</style>
</head>
<body>
<div class="page" id="page">
  <p class="etat" id="etat">Chargement…</p>
</div>

<script>
(function () {
  // L'identifiant vient du chemin (`/club/<uuid>`, réécrit vers ce fichier) ou de `?id=`, pour
  // que le lien reste ouvrable même si la réécriture tombe.
  var chemin = location.pathname.split('/').filter(Boolean);
  var id = new URLSearchParams(location.search).get('id') || chemin[chemin.length - 1] || '';

  var page = document.getElementById('page');
  var etat = document.getElementById('etat');

  function echappe(texte) {
    var d = document.createElement('div');
    d.textContent = texte == null ? '' : String(texte);
    return d.innerHTML;
  }

  // « MAR. 28 OCT. · 19:00 », dans le fuseau de qui lit — une séance se donne à une heure
  // locale, et personne n'ouvre ce lien depuis un autre pays pour venir courir.
  function quand(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var jour = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    var heure = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    return (jour + ' · ' + heure).toUpperCase();
  }

  if (!id) {
    etat.textContent = "Ce lien n'est pas complet.";
    return;
  }

  fetch('/api/clubs/public?id=' + encodeURIComponent(id))
    .then(function (r) {
      if (!r.ok) throw new Error('introuvable');
      return r.json();
    })
    .then(function (club) {
      document.title = club.name + ' — RUNUP';
      var html = '';
      if (club.coverUrl) {
        html += '<img class="cover" alt="" src="' + echappe(club.coverUrl) + '">';
      }
      html += '<h1>' + echappe(club.name) + '</h1>';

      var meta = [];
      if (club.city) meta.push(echappe(club.city));
      meta.push(club.memberCount + (club.memberCount > 1 ? ' membres' : ' membre'));
      html += '<p class="meta">' + meta.join(' · ') + '</p>';

      if (club.description) html += '<p class="desc">' + echappe(club.description) + '</p>';

      if (club.sessions && club.sessions.length) {
        html += '<h2>Les prochaines séances</h2>';
        club.sessions.forEach(function (s) {
          html += '<div class="seance">';
          html += '<div class="quand">' + echappe(quand(s.startsAt));
          if (s.repeatsWeekly) html += '<span class="repete">chaque semaine</span>';
          html += '</div>';
          html += '<div class="titre">' + echappe(s.title) + '</div>';
          if (s.location) html += '<div class="lieu">' + echappe(s.location) + '</div>';
          if (s.going > 0) {
            html += '<div class="venus">' + s.going + (s.going > 1 ? ' au départ' : ' au départ') + '</div>';
          }
          html += '</div>';
        });
      }

      // Le lien EST cette page. Sur un iPhone où l'app est installée, iOS l'ouvre dedans sans
      // passer par le navigateur (voir .well-known/apple-app-site-association) ; sinon il
      // revient ici, ce qui est exactement ce qu'on veut qu'il fasse.
      html += '<a class="cta" href="' + echappe(location.href) + '">Rejoindre sur RUNUP</a>';
      html += '<p class="note">Ouvre l\'app RUNUP sur ton iPhone pour rejoindre ce club.</p>';
      html += '<footer><a href="https://hicsuntco.github.io/RUNUP/privacy.html">Confidentialité</a></footer>';

      page.innerHTML = html;
    })
    .catch(function () {
      // Un club fermé et un club inexistant répondent la même chose, et c'est voulu : « il
      // existe mais il est fermé » serait déjà une information sur lui.
      etat.textContent = "Ce club n'existe pas, ou n'est pas ouvert aux nouvelles arrivées.";
    });
})();
</script>
</body>
</html>
