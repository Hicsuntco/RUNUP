# De ce dépôt à TestFlight, sans passer par Xcode.
#
# Ce workflow fait ce que tu faisais à la main dans Xcode — générer le projet, le construire,
# le signer, l'envoyer à App Store Connect — sur une machine macOS louée à GitHub, à partir du
# code tel qu'il est commité. L'intérêt n'est pas le confort : c'est qu'un build livré aux
# testeurs corresponde exactement à un commit, et pas à l'état de ta machine ce jour-là.
#
# ─── CE QU'IL FAUT AVOIR CRÉÉ AVANT LE PREMIER LANCEMENT ────────────────────────────────────────
#
# Neuf secrets, dans Settings → Secrets and variables → Actions → New repository secret. Aucune de
# ces valeurs ne doit être écrite ailleurs que là : ni dans un fichier du dépôt, ni dans un
# message, ni dans une capture d'écran.
#
#   RUNUP_APP_SECRET          Le secret partagé avec `api/coach.js`, exactement la même chaîne que
#                             la variable du même nom côté Vercel. Sans lui, le coach répond 401
#                             dans le build — tout le reste marche, ce qui rend la panne difficile
#                             à voir.
#
#   APPLE_DIST_CERT_P12       Ton certificat de distribution Apple, exporté depuis Trousseaux
#                             d'accès (clic droit sur « Apple Distribution: … » → Exporter →
#                             format .p12), puis encodé en base64 :
#                                 base64 -i Certificats.p12 | pbcopy
#                             C'est le contenu encodé qui va dans le secret, pas le fichier.
#
#   APPLE_DIST_CERT_PASSWORD  Le mot de passe choisi pendant cet export.
#
#   ASC_KEY_ID                App Store Connect → Users and Access → Integrations → App Store
#   ASC_ISSUER_ID             Connect API → « + ». Rôle **Admin**, et pas « App Manager » : ce
#   ASC_KEY_P8                dernier laisse bien Xcode créer des profils de développement, donc
#                             l'archivage réussit, puis l'export se fait refuser la signature dans
#                             le nuage — « Cloud signing permission error », après un quart d'heure
#                             de machine. Le rôle d'une clé est figé à sa création : pour le
#                             corriger il faut révoquer la clé et en créer une autre.
#                             La page affiche le Key ID et l'Issuer ID, et propose UNE SEULE FOIS
#                             le téléchargement du fichier AuthKey_XXXXXXXXXX.p8 — Apple ne le
#                             redonne jamais. Encode-le pareil :
#                                 base64 -i AuthKey_XXXXXXXXXX.p8 | tr -d '\n' | gh secret set ASC_KEY_P8
#
#   APPLE_PROFILE_APP         Les trois profils de provisionnement de DISTRIBUTION, un par cible.
#   APPLE_PROFILE_WIDGETS     developer.apple.com → Certificates, Identifiers & Profiles →
#   APPLE_PROFILE_WATCH       Profiles → « + » → Distribution → App Store Connect, une fois par
#                             bundle ID (com.hicsuntco.runup, .widgets, puis .watchkitapp en
#                             choisissant watchOS). Télécharge les trois .mobileprovision et
#                             encode-les comme le reste. Ils expirent au bout d'un an.
#
# Le Team ID (SW49TQ25NV) n'est pas un secret : il est déjà dans `project.yml`, et les options
# d'export sont fabriquées à l'exécution à partir des profils eux-mêmes.
#
# ─── CE QUE ÇA COÛTE ────────────────────────────────────────────────────────────────────────────
#
# Sur un dépôt privé, GitHub facture les machines macOS DIX FOIS le tarif d'une machine Linux.
# D'où les deux garde-fous ci-dessous : les commits qui ne touchent qu'au serveur ou à la
# documentation ne déclenchent rien, et deux exécutions ne se chevauchent jamais.

name: TestFlight

on:
  # Le bouton : Actions → TestFlight → Run workflow. C'est par là que passe un envoi décidé,
  # y compris depuis le téléphone.
  workflow_dispatch:
    inputs:
      build_number:
        description: "Numéro de build à imposer (vide = 1000 + numéro d'exécution)"
        required: false
        type: string

  push:
    branches:
      - claude/runup-ios-swiftui-app-5b1yv6
    # Rien de ce qui suit ne peut changer le binaire iOS d'un octet : le déclencher pour un
    # correctif d'API ou une phrase de politique de confidentialité, ce serait payer une machine
    # macOS pour reconstruire à l'identique.
    paths-ignore:
      - "api/**"
      - "lib/**"
      - "db/**"
      - "public/**"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "**/*.md"
      - "privacy.html"
      - "design_handoff_runup_app/**"

# Deux envois en parallèle produiraient deux builds et une course à qui arrive le premier chez
# Apple. `cancel-in-progress: false` : on laisse finir celui qui est déjà en train de signer
# plutôt que de le tuer au milieu.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      # Le Xcode par défaut de l'image n'est pas forcément le plus récent qu'elle contient, et ce
      # détail décide de l'issue : App Store Connect a REFUSÉ un IPA parfaitement signé parce
      # qu'il avait été construit avec le SDK iOS 18.5 de Xcode 16.4, alors qu'Apple exige
      # désormais le SDK iOS 26 ou plus. Le refus arrive à la toute dernière étape, après vingt
      # minutes de machine, et ne dit rien du fait que la machine avait un Xcode plus récent
      # sous la main.
      #
      # D'où : on choisit explicitement le plus récent, et on vérifie le SDK AVANT de compiler.
      - name: Choisir Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "→ Xcode retenu : $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          sdk=$(xcodebuild -showsdks | grep -Eo "iphoneos[0-9.]+" | sort -V | tail -1 | sed "s/iphoneos//")
          if [ -z "$sdk" ]; then
            echo "✗ Aucun SDK iOS trouvé — xcode-select a-t-il pointé sur une installation valide ?"
            xcodebuild -showsdks
            exit 1
          fi
          echo "→ SDK iOS le plus récent : $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo ""
            echo "✗ App Store Connect refuse tout binaire construit avec un SDK iOS antérieur à 26."
            echo "  Cette machine ne propose que le SDK $sdk. Il faut une image plus récente"
            echo "  (le champ runs-on du workflow)."
            exit 1
          fi

      # Les six secrets sont vérifiés ICI, avant tout le reste, parce qu'un secret absent ne se
      # présente pas comme un secret absent.
      #
      # Un `ASC_KEY_P8` vide a déjà produit ceci : le workflow écrit un fichier de zéro octet,
      # l'archivage démarre normalement, et `xcodebuild` répond quatre minutes plus tard
      # « Invalid authentication key credential (CryptoKitASN1Error.invalidPEMDocument) » — un
      # message qui parle de cryptographie pour dire « ce fichier est vide ». Entre-temps la
      # machine a compilé et exécuté toute la suite de tests, facturée dix fois le tarif normal.
      #
      # Rien ici n'affiche la moindre valeur : seulement des noms et un verdict.
      - name: Vérifier les secrets
        env:
          RUNUP_APP_SECRET: ${{ secrets.RUNUP_APP_SECRET }}
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_PROFILE_APP: ${{ secrets.APPLE_PROFILE_APP }}
          APPLE_PROFILE_WIDGETS: ${{ secrets.APPLE_PROFILE_WIDGETS }}
          APPLE_PROFILE_WATCH: ${{ secrets.APPLE_PROFILE_WATCH }}
        run: |
          missing=0
          for name in RUNUP_APP_SECRET APPLE_DIST_CERT_P12 APPLE_DIST_CERT_PASSWORD \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 \
                      APPLE_PROFILE_APP APPLE_PROFILE_WIDGETS APPLE_PROFILE_WATCH; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "✗ $name — absent ou vide"
              missing=1
            else
              echo "✓ $name"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Settings → Secrets and variables → Actions."
            echo "Voir IOS_SETUP.md § « Envoyer un build sur TestFlight » pour l'origine de chacun."
            exit 1
          fi

          # Deux secrets sont des fichiers encodés en base64. Un encodage raté produit une chaîne
          # non vide qui passe le test ci-dessus et casse bien plus loin — on décode donc pour de
          # bon, et on regarde si ce qui sort ressemble à ce que ça doit être.
          if ! echo "$ASC_KEY_P8" | base64 -d 2>/dev/null | head -1 | grep -q "BEGIN PRIVATE KEY"; then
            echo ""
            echo "✗ ASC_KEY_P8 ne redonne pas une clé PEM une fois décodé."
            echo "  Le secret doit contenir le base64 du fichier AuthKey_XXXXXXXXXX.p8 :"
            echo "    base64 -i AuthKey_XXXXXXXXXX.p8 | tr -d '\\n' | gh secret set ASC_KEY_P8"
            exit 1
          fi
          echo "✓ ASC_KEY_P8 redonne bien une clé PEM"

          # Une archive PKCS#12 est du DER : elle commence toujours par 30 82 (une SEQUENCE).
          magic=$(echo "$APPLE_DIST_CERT_P12" | base64 -d 2>/dev/null | head -c 2 | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "3082" ]; then
            echo ""
            echo "✗ APPLE_DIST_CERT_P12 ne redonne pas une archive PKCS#12 une fois décodé."
            exit 1
          fi
          echo "✓ APPLE_DIST_CERT_P12 redonne bien une archive PKCS#12"

          # Chaque profil est un plist enveloppé dans une signature CMS. Le décoder ici coûte une
          # seconde et évite de découvrir à l'export qu'un des trois secrets contient autre chose.
          for slot in APP WIDGETS WATCH; do
            eval "b64=\${APPLE_PROFILE_$slot}"
            # Passer par un fichier : `security cms` relit son entrée, ce qu'un tube ne permet
            # pas — sur /dev/stdin il échouerait sur un profil parfaitement valide.
            probe="$RUNNER_TEMP/probe-$slot.mobileprovision"
            echo "$b64" | base64 -d > "$probe" 2>/dev/null || true
            if ! security cms -D -i "$probe" > /dev/null 2>&1; then
              echo ""
              echo "✗ APPLE_PROFILE_$slot ne redonne pas un profil de provisionnement lisible."
              echo "  Le secret doit contenir le base64 du .mobileprovision telecharge depuis"
              echo "  developer.apple.com. Voir IOS_SETUP.md."
              rm -f "$probe"
              exit 1
            fi
            rm -f "$probe"
          done
          echo "✓ Les trois profils de provisionnement sont lisibles"

      - name: Installer XcodeGen
        run: brew install xcodegen

      # Le numéro de build doit croître à chaque envoi, et ne jamais retomber sous un numéro déjà
      # reçu par App Store Connect. `github.run_number` s'incrémente tout seul mais repart de 1 ;
      # or Xcode Cloud a déjà envoyé des builds numérotés autour de 14. D'où le décalage de 1000 :
      # cette chaîne-ci commence au-dessus de tout ce qui existe et ne peut plus la rattraper.
      #
      # Conséquence à connaître : après un envoi d'ici, un build Xcode Cloud (qui numérote 15, 16…)
      # sera refusé pour la même version. Les deux chaînes ne peuvent pas alterner ; il faut en
      # choisir une.
      - name: Calculer le numéro de build
        id: build
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            NUMBER="${{ inputs.build_number }}"
          else
            NUMBER=$(( 1000 + GITHUB_RUN_NUMBER ))
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Build $NUMBER"

      # Écrit Secrets.xcconfig, impose le numéro de build aux trois cibles, génère le .xcodeproj.
      # Exactement le même script que celui qu'exécute Xcode Cloud (`ci_post_clone.sh`), pour que
      # les deux chaînes ne puissent pas produire des binaires différents.
      - name: Préparer le projet
        env:
          RUNUP_APP_SECRET: ${{ secrets.RUNUP_APP_SECRET }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: sh ci_scripts/prepare_project.sh

      # `Font.custom` ne lève rien sur un nom de police introuvable : SwiftUI retombe en silence
      # sur la police système. Une famille renommée, un fichier oublié dans l'UIAppFonts d'une
      # cible, un nom PostScript qui n'est pas celui qu'on croit — rien de tout ça ne casse le
      # build, et ça ne se voit que sur l'appareil, écran par écran. Neuf builds sont partis avec
      # ce défaut avant qu'il soit compris. Cette vérification coûte une seconde et le rend
      # impossible à répéter.
      # La fiche a des limites de champ dures : au-delà, App Store Connect refuse le collage, et
      # ça ne se découvre qu'au moment de la saisie, après avoir tout rédigé. Le bloc d'abonnement
      # obligatoire a fait dépasser deux descriptions, et la vérification a été faite après
      # publication deux fois de suite.
      - name: Vérifier la fiche App Store
        run: python3 ci_scripts/check_listing.py

      - name: Vérifier que les polices demandées sont livrées
        run: python3 ci_scripts/check_fonts.py

      # Les tests tournent AVANT la signature, sur simulateur, donc sans certificat : un échec
      # coûte cinq minutes de machine au lieu de la construction complète. Et surtout,
      # `RouteSharingPrivacyTests` vérifie que les 300 premiers et derniers mètres d'un tracé
      # partagé sont bien retirés — c'est la seule promesse de cette app dont la rupture publierait
      # l'adresse de quelqu'un. Aucun build ne doit partir aux testeurs sans qu'elle ait été
      # vérifiée.
      - name: Tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 -E '^ *iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "✗ Aucun simulateur iPhone disponible sur cette machine."
            xcrun simctl list devices available
            exit 1
          fi
          echo "→ Simulateur : $UDID"
          xcodebuild test \
            -project RunUp.xcodeproj \
            -scheme RunUp \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      # Le certificat de distribution vit dans un trousseau JETABLE, créé ici et détruit à la fin
      # du job (voir la dernière étape). Il n'est jamais ajouté au trousseau par défaut de la
      # machine : les machines GitHub sont réinitialisées entre deux exécutions, mais compter
      # là-dessus pour une clé privée de signature serait une hypothèse, pas une garantie.
      - name: Installer le certificat de signature
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/runup-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          CERT="$RUNNER_TEMP/dist.p12"
          echo "$CERT_P12_BASE64" | base64 -d > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          # Sans ça, macOS ouvre une boîte de dialogue « autoriser codesign à utiliser cette
          # clé ? » — sur une machine sans écran, la construction reste bloquée jusqu'au délai.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Le trousseau doit figurer dans la liste de recherche, sinon codesign ne le regarde pas.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT"
          echo "→ Identités disponibles :"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/[0-9A-F]\{40\}/…/'

      # La clé d'API App Store Connect sert deux fois : à laisser Xcode créer et télécharger les
      # profils de signature des trois bundle IDs (`-allowProvisioningUpdates`), puis à envoyer
      # l'IPA. `altool` la cherche à cet emplacement précis, sous ce nom précis.
      - name: Installer la clé d'API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Les profils de provisionnement de distribution, fournis en secrets plutôt que réclamés à
      # Apple au moment de l'export.
      #
      # La signature automatique a bien fonctionné pour ARCHIVER — Xcode a créé des profils de
      # DÉVELOPPEMENT tout seul. Mais l'export vers l'App Store réclame des profils de
      # DISTRIBUTION, que la signature automatique ne sait obtenir que par la « signature dans le
      # nuage », laquelle a répondu « Cloud signing permission error » sur les trois bundle IDs
      # avec une clé d'équipe Admin — donc pour une raison qui ne dépend ni de ce dépôt ni de ce
      # workflow. Trois profils fournis à l'avance suppriment cette dépendance entière : plus rien
      # n'est demandé à Apple pendant l'export.
      #
      # Le prix : les profils expirent au bout d'un an et devront être régénérés. C'est écrit dans
      # IOS_SETUP.md, avec la commande.
      #
      # Rien n'est codé en dur ici : le bundle ID, le nom et l'UUID sont LUS dans chaque profil.
      # Une correspondance recopiée à la main entre un nom de profil et un bundle ID serait fausse
      # dès que tu renommes un profil dans le portail Apple, et l'erreur ne sortirait qu'à
      # l'export.
      - name: Installer les profils de provisionnement
        env:
          PROFILE_APP: ${{ secrets.APPLE_PROFILE_APP }}
          PROFILE_WIDGETS: ${{ secrets.APPLE_PROFILE_WIDGETS }}
          PROFILE_WATCH: ${{ secrets.APPLE_PROFILE_WATCH }}
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          MAP="$RUNNER_TEMP/profile-map.txt"
          : > "$MAP"
          for slot in APP WIDGETS WATCH; do
            eval "b64=\${PROFILE_$slot}"
            raw="$RUNNER_TEMP/$slot.mobileprovision"
            echo "$b64" | base64 -d > "$raw"
            # Un .mobileprovision est un plist signé en CMS : il faut le désenvelopper pour le lire.
            plist="$RUNNER_TEMP/$slot.plist"
            security cms -D -i "$raw" > "$plist"
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$plist")
            pname=$(/usr/libexec/PlistBuddy -c "Print :Name" "$plist")
            # `application-identifier` vaut TEAMID.bundle.id ; on retire le préfixe d'équipe.
            appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$plist")
            bundle=${appid#*.}
            cp "$raw" "$DIR/$uuid.mobileprovision"
            echo "$bundle=$pname" >> "$MAP"
            echo "  ✓ $bundle → $pname"
          done
          echo "PROFILE_MAP=$MAP" >> "$GITHUB_ENV"

      - name: Archiver
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project RunUp.xcodeproj \
            -scheme RunUp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/RunUp.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      # Les options d'export sont ÉCRITES ICI, à partir des profils réellement installés, plutôt
      # que lues dans un fichier versionné : la correspondance bundle ID → profil ne peut donc pas
      # mentir sur ce que la machine a sous la main.
      #
      # Plus de `-allowProvisioningUpdates` ni de clé d'authentification sur cette commande : c'est
      # exactement ce qui déclenchait la signature dans le nuage. Tout ce dont l'export a besoin
      # est déjà sur la machine — le certificat dans le trousseau, les trois profils dans le
      # dossier où Xcode les cherche.
      - name: Exporter l'IPA
        run: |
          set -euo pipefail
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          python3 - "$PROFILE_MAP" "$OPTS" <<'PYTHON'
          import sys, plistlib
          profiles = {}
          for line in open(sys.argv[1]):
              line = line.strip()
              if line:
                  bundle, name = line.split("=", 1)
                  profiles[bundle] = name
          plistlib.dump({
              # « app-store-connect » depuis Xcode 15.4 ; « app-store » ne fait plus que
              # survivre par compatibilité.
              "method": "app-store-connect",
              "teamID": "SW49TQ25NV",
              "signingStyle": "manual",
              # Le trousseau contient aussi deux identités de DÉVELOPPEMENT ; nommer la famille
              # évite que codesign attrape la mauvaise.
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": profiles,
              "uploadSymbols": True,
              # À `true` (le défaut), Xcode réécrirait le numéro de build à l'export et le lien
              # entre un build TestFlight et le commit qui l'a produit serait rompu.
              "manageAppVersionAndBuildNumber": False,
          }, open(sys.argv[2], "wb"))
          PYTHON
          echo "→ Options d'export :"
          plutil -p "$OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RunUp.xcarchive" \
            -exportOptionsPlist "$OPTS" \
            -exportPath "$RUNNER_TEMP/export" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
          ls -lh "$RUNNER_TEMP/export"

      # Gardé 14 jours. Quand un envoi est refusé par App Store Connect, c'est ce fichier qu'on
      # inspecte — sans lui, il faut relancer toute la construction pour comprendre.
      - name: Conserver l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: RunUp-${{ steps.build.outputs.number }}.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Envoyer à TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "→ Envoi de $(basename "$IPA")"
          # `--upload-package` demanderait de décrire le paquet à la main ; `--upload-app` lit
          # tout dans l'IPA, et refuse un binaire invalide avec les mêmes messages que la
          # validation séparée — laquelle téléverserait l'IPA une deuxième fois pour rien.
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "✓ Build ${{ steps.build.outputs.number }} envoyé."
          echo "  Apple met dix à trente minutes à le traiter avant qu'il apparaisse dans TestFlight."

      # `if: always()` : une construction qui échoue à mi-chemin ne doit pas laisser derrière elle
      # un trousseau déverrouillé contenant la clé privée de signature, ni la clé d'API.
      - name: Effacer les secrets de la machine
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/runup-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys
