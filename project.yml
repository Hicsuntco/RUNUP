name: RunUp
options:
  bundleIdPrefix: com.hicsuntco.runup
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

targets:
  RunUp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # UNE SEULE ENTRÉE, ET ELLE PORTE AUSSI LES RESSOURCES.
      #
      # `RunUp/Resources/` est sous ce chemin. XcodeGen classe chaque fichier qu'il y trouve selon
      # son extension, et les catalogues, les polices et le manifeste de confidentialité vont bien
      # dans la phase « Copy Bundle Resources » : il n'y a rien à redéclarer. Il y avait ici une
      # clé `resources:` qui les relistait — elle ne servait à rien, et pire que rien : voir le
      # bloc sur les ressources de `RunUpWatch` plus bas, cette clé n'existe pas dans XcodeGen et
      # ce qu'on y écrit est jeté sans un mot.
      #
      # Les trois fichiers de ce dossier qu'il faut savoir présents, et pourquoi :
      #
      # · `Localizable.xcstrings` — les traductions de l'app (fr, en, es).
      #
      # · `InfoPlist.xcstrings` — traduit les descriptions d'autorisation (`NS*UsageDescription`
      #   ci-dessous). Sans ce catalogue, ces chaînes ne passent PAS par `Localizable.xcstrings`
      #   — elles vivent dans l'Info.plist — et iOS affichait donc ses dialogues système en
      #   français à tout le monde, au moment précis où l'on demande à quelqu'un l'accès à sa
      #   position, à son micro et à ses données de santé. Ses clés sont les clés Info.plist
      #   elles-mêmes, pas les phrases.
      #
      # · `PrivacyInfo.xcprivacy` — obligatoire depuis mai 2024 : sans ce fichier dans le bundle,
      #   App Store Connect refuse le binaire à l'ENVOI (ITMS-91053), avant toute revue humaine.
      #
      # `ci_scripts/check_spec.py` vérifie que les polices enregistrées et les traductions sont
      # réellement livrées à chaque cible qui les déclare — c'est ce contrôle qui manquait.
      - path: RunUp
        excludes:
          - "Resources/Fonts/*.md"
    # Build settings that can't be committed with their real values (the coach's shared secret)
    # come from here — a committed file of empty defaults that optionally includes the gitignored
    # `Secrets.xcconfig` holding the actual values. See Config.xcconfig and IOS_SETUP.md
    # § "Coach backend".
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: RunUp/Info.plist
      properties:
        CFBundleDisplayName: RunUp
        # Shared app↔server secret for the coach proxy, substituted at build time from the
        # RUNUP_APP_SECRET build setting (Config.xcconfig → Secrets.xcconfig) instead of living as
        # a string literal in CoachService.swift, where it was committed in plain text. Read back
        # at runtime by `CoachService.appSecret` — see the comment there on why an embedded secret
        # is a deterrent against casual abuse, not a real boundary.
        RUNUPAppSecret: "$(RUNUP_APP_SECRET)"
        # Trilingue, et cette fois pour de vrai.
        #
        # Ces trois langues avaient été ramenées au seul français parce que la couverture
        # s'arrêtait là où l'app cessait d'afficher des littéraux : le moteur de plan composait
        # ses titres de séance en français puis les ÉCRIVAIT EN BASE, et une centaine d'autres
        # chaînes étaient construites à l'exécution en `String`, que SwiftUI ne localise pas.
        # Un téléphone anglais affichait donc un chrome traduit autour d'un programme français.
        #
        # Ce n'est plus le cas : chaque séance porte un `SessionKind` indépendant de la langue et
        # son texte est rédigé à l'affichage, ~400 chaînes composées passent par
        # `String(localized:)`, et le formatage des dates et des nombres suit `Locale.current`
        # au lieu d'un `fr_FR` figé.
        CFBundleLocalizations:
          - fr
          - en
          - es
        # APPLE FERME LE TRAIN D'UNE VERSION DÈS QU'ELLE EST PUBLIÉE.
        #
        # La 3.3 est sortie le 3 novembre 2026. Depuis, tout envoi à TestFlight en 3.3 est refusé
        # avec deux erreurs : « The train version '3.3' is closed for new build submissions »
        # (90186) et « CFBundleShortVersionString [3.3] must contain a higher version than that of
        # the previously approved version » (90062). La construction est verte, les tests sont
        # verts, l'archive est signée, et seul le dernier pas échoue — c'est-à-dire que le défaut
        # ne se voit qu'après dix minutes de machine macOS.
        #
        # Ce numéro monte donc DÈS que la version précédente est publiée, et pas au moment de
        # préparer la suivante. `CFBundleVersion` reste là pour mémoire : la chaîne l'impose aux
        # trois cibles depuis `prepare_project.sh` (1000 + numéro d'exécution).
        CFBundleShortVersionString: "3.4"
        CFBundleVersion: "14"
        # Synthesized launch storyboard (no custom .storyboard file) — a plain color is all it
        # can show (the real animated wordmark only runs once app code is live, see
        # `SplashView`), but this stops the default white flash before that even appears.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Lets ASWebAuthenticationSession capture Strava's OAuth redirect (see StravaService.swift)
        # — Strava's app settings must have this exact URI (runup://strava-callback) added as an
        # "Authorization Callback Domain"/redirect URI once she creates her Strava API application.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - runup
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait-only design (see DesignSystem/); without this, Apple's App Store validation
        # rejects the bundle for not supporting iPad Split View multitasking's full 4-orientation
        # set. This opts the app out of that requirement instead of adding rotation support.
        UIRequiresFullScreen: true
        NSHealthShareUsageDescription: "RunUp lit tes données Santé (les courses enregistrées par ta montre ou une autre app, leur parcours, fréquence cardiaque, nombre de pas, calories actives, sommeil) pour faire compter tes sorties dans ton programme, calculer ta forme du jour et suivre tes objectifs quotidiens."
        NSHealthUpdateUsageDescription: "RunUp enregistre tes séances de course dans Santé après chaque sortie."
        NSLocationWhenInUseUsageDescription: "RunUp utilise ta position pour suivre ta distance, ton allure et ton tracé pendant une course."
        NSMicrophoneUsageDescription: "RunUp utilise le micro pour t'écouter quand tu poses une question à voix haute à ton coach pendant une course."
        # Le carnet d'adresses ne quitte JAMAIS le téléphone : l'app hache les adresses e-mail sur
        # l'appareil et n'envoie que les empreintes (voir `ContactMatcher`). La phrase le dit, parce
        # que c'est la seule chose que la personne veut savoir au moment où iOS lui pose la question.
        NSContactsUsageDescription: "RunUp compare tes contacts aux comptes existants pour te dire qui utilise déjà l'app. Les adresses sont transformées en empreintes illisibles sur ton téléphone avant l'envoi — ton carnet d'adresses n'en sort jamais, et rien n'est conservé."
        NSSpeechRecognitionUsageDescription: "RunUp transcrit ce que tu dis pour que ton coach puisse te répondre à voix haute pendant une course."
        # `location` only — the run tracker really does keep GPS alive with the screen off.
        # `remote-notification` used to be listed too, but the server only ever sends visible
        # alert pushes (lib/apns.js), which need no background mode, and no silent-push handler
        # exists — an unused background mode is an App Review 2.5.4 flag.
        UIBackgroundModes:
          - location
          # Le réveil météo (`WeatherBackgroundRefresh`). Sans ce mode, `BGTaskScheduler.submit`
          # lève et le conseil n'arrive qu'à l'ouverture de l'app — donc jamais « la veille » chez
          # quelqu'un qui ne l'ouvre pas le soir.
          - fetch
        # Doit contenir À L'IDENTIQUE l'identifiant de `WeatherBackgroundRefresh`. Un identifiant
        # absent de cette liste fait LEVER UNE EXCEPTION à l'enregistrement, pendant le lancement :
        # l'app ne démarre pas du tout. Les deux écritures ne peuvent donc pas diverger en silence.
        BGTaskSchedulerPermittedIdentifiers:
          - com.hicsuntco.runup.weather-refresh
        # Lets `LiveRunViewModel` start a Live Activity (Lock Screen + Dynamic Island) for the
        # in-progress run — see `RunActivityAttributes` (Shared/) and `RunActivityWidget`
        # (RunUpWidgets/). `FrequentUpdates` avoids the system throttling `Activity.update` calls
        # down to roughly once a minute — a run updates its own Live Activity every 5s.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Inter-Light.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-Italic.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
    dependencies:
      - target: RunUpWidgets
        embed: true
      - target: RunUpWatch
        embed: true
    entitlements:
      path: RunUp/RunUp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Required (iOS 15+) for HKObserverQuery background delivery — what lets steps/calories
        # updates wake the app briefly so the widget refreshes without her opening the app.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
        # Les prévisions horaires qui décident de proposer un autre créneau quand la séance tombe
        # sous la pluie — voir `RunWeatherService` et `WeatherAdvice`.
        #
        # ⚠️ UNE ÉTAPE MANUELLE, ET UNE SEULE, QUI NE PEUT PAS SE FAIRE D'ICI : WeatherKit doit
        # être activé pour l'identifiant d'app sur developer.apple.com (Certificates, Identifiers
        # & Profiles → Identifiers → com.hicsuntco.runup → cocher WeatherKit → Save), puis les
        # profils de provisionnement régénérés. Sans ça la signature échoue à l'archivage, avec un
        # message qui ne nomme pas WeatherKit.
        #
        # Le quota gratuit est de 500 000 appels par mois avec un compte développeur. Cette
        # fonctionnalité en fait UN par jour et par personne, au plus.
        com.apple.developer.weatherkit: true
        # Shares today's goals/streak/theme with the Home Screen widget (`RunUpWidgets` target) —
        # the widget runs in its own process with no other way to reach `UserProfile`. Needs a real
        # App Group created under her Apple Developer account (Certificates, Identifiers & Profiles
        # → Identifiers → App Groups) before this entitlement can actually provision — Xcode's
        # automatic signing usually offers to create it inline the first time you add the "App
        # Groups" capability in Signing & Capabilities if it doesn't exist yet.
        com.apple.security.application-groups:
          - group.com.hicsuntco.runup
        # Lets a tapped referral link (https://runup-nu.vercel.app/r/CODE) open straight into the
        # app with the code prefilled instead of just a webpage — see
        # public/.well-known/apple-app-site-association (must stay in sync: same domain here as
        # `appIDs`/`components` there) and `ReferralLinkHandler.swift`. Apple only actually
        # verifies this once the app is signed with a real provisioning profile on a device/
        # TestFlight — the Simulator can still open the URL via `.onOpenURL` for testing, it just
        # won't have gone through the system's AASA verification step first.
        com.apple.developer.associated-domains:
          - applinks:runup-nu.vercel.app
        # Xcode's automatic signing rewrites this to "production" itself when archiving for
        # TestFlight/App Store (matched to the distribution provisioning profile) — "development"
        # here is what a Debug run from Xcode to a real device actually needs.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SW49TQ25NV
    # Un schéma PARTAGÉ, déclaré ici plutôt que laissé à l'auto-création.
    #
    # `xcodebuild archive` exige un schéma. Sans déclaration, Xcode en fabrique un à la volée à la
    # première ouverture du projet — invisible sur ta machine, mais fabriqué par une heuristique
    # sur laquelle on n'a aucune prise, et refabriqué à chaque `xcodegen generate` sur une machine
    # de CI qui, elle, part d'un dépôt sans `.xcodeproj`. Le déclarer, c'est garantir que la
    # commande d'archivage du workflow trouve toujours la même chose, et que `RunUpTests` est bien
    # attaché à l'action « Test » — sinon la CI construit sans jamais exécuter les tests de
    # confidentialité des itinéraires, ce qui est exactement le contraire du but.
    scheme:
      testTargets:
        - RunUpTests

  # Home Screen widget — shows the same single-ring 3-goal widget as `DailyGoalsBarsView`/streak,
  # fed by `DailyGoalsSnapshot` over the shared App Group rather than any live in-app state (a
  # widget extension is a separate process, restarted on its own schedule by the system — it can
  # never hold a live reference to `AppState`). Reuses `RunUp/Shared`'s `Color(hex:)`/`.darkened(_:)`
  # (pure, target-agnostic math) and the app's real brand fonts (bundled + declared below, same as
  # the main target), but not the rest of `RunUp/DesignSystem` — `RUColor`/`ThemeStore` are
  # in-memory singletons the app's process keeps live and this one can't, so
  # `WidgetAccentPalette.swift` mirrors just the handful of theme values needed.
  RunUpWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunUpWidgets
      - path: RunUp/Shared
        excludes:
          # `RouteGeometry` travaille sur des `RunRecord.RoutePoint`, et `RunRecord` vit dans
          # `RunUp/Models`, qui n'est PAS compilé dans cette extension — ce fichier y provoquait
          # donc une erreur « cannot find type 'RunRecord' in scope » depuis son introduction.
          # Le widget dessine des anneaux et des objectifs, jamais un parcours : l'exclure est la
          # bonne réponse, plutôt que de tirer tout le modèle de données dans l'extension.
          - "RouteGeometry.swift" 
      # ─── LES RESSOURCES PARTAGÉES PASSENT PAR `sources:` ──────────────────────────────────────
      #
      # Elles étaient sous une clé `resources:`, qui n'existe pas. Le pourquoi, la mesure et la
      # citation sont écrits une seule fois, dans la cible `RunUpWatch` ci-dessous ; la même cause
      # frappait les deux extensions, et pour la même raison : ces deux chemins sont HORS de
      # `RunUpWidgets/`, donc rien d'autre ne les faisait entrer.
      #
      # Ce que ça coûtait ici : le widget de l'écran d'accueil affichait « BOUCLÉS », « SÉANCE »,
      # « KCAL » en français à tout le monde, dans la police système au lieu d'Inter — à côté
      # d'une app, elle, correctement traduite et correctement composée.
      #
      # `PrivacyInfo.xcprivacy` n'est pas relisté : il est dans `RunUpWidgets/`, donc l'entrée
      # ci-dessus le porte déjà. L'extension est signée et livrée séparément de l'app, le
      # manifeste de l'app ne la couvre pas, il lui faut le sien — et elle l'a.
      - path: RunUp/Resources/Fonts
        buildPhase: resources
        excludes:
          - "*.md"
          # Cette cible ne déclare que 3 fichiers dans son UIAppFonts, et ce que l'UIAppFonts
          # n'enregistre pas ne peut pas se charger : embarquer les 5 autres n'ajouterait que
          # ~750 Ko de poids mort dans une extension.
          - "Inter-Light.ttf"
          - "Inter-Regular.ttf"
          - "Inter-Italic.ttf"
          - "DMMono-Regular.ttf"
          - "DMMono-Medium.ttf"
      - path: RunUp/Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: RunUpWidgets/Info.plist
      properties:
        CFBundleDisplayName: RunUp
        # App Store validation requires an extension's version to match its host app's — keep
        # these two in step with `RunUp`'s `CFBundleShortVersionString`/`CFBundleVersion` above.
        CFBundleShortVersionString: "3.4"
        CFBundleVersion: "14"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Only the 3 weights this widget actually draws with — no need to ship the whole main-app
        # font set into a second bundle. Same family as the app (DisplayFont.family): a widget in a
        # different typeface than the app is the one mismatch a user sees side by side.
        UIAppFonts:
          - Inter-Medium.ttf
          - Inter-Bold.ttf
          - Inter-SemiBold.ttf
    entitlements:
      path: RunUpWidgets/RunUpWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hicsuntco.runup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SW49TQ25NV
        TARGETED_DEVICE_FAMILY: "1"

  # Apple Watch companion — a real standalone run tracker on the wrist: HKWorkoutSession +
  # HKLiveWorkoutBuilder (live wrist heart rate, distance, active calories — sensor data the
  # iPhone app alone never had), today's session pushed from the phone over WatchConnectivity,
  # and each finished run transferred back to the phone, which inserts the RunRecord and runs the
  # debrief/adaptive-plan mechanic (that engine stays phone-side on purpose). Reuses RunUp/Shared
  # (Color(hex:)/darkened — pure, target-agnostic) the same way RunUpWidgets does.
  RunUpWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      # Ce chemin porte le code de la montre ET ses deux ressources propres :
      # `RunUpWatch/Assets.xcassets`, et `RunUpWatch/InfoPlist.xcstrings` — un catalogue distinct
      # de celui de l'iPhone, parce que la montre a ses propres textes d'autorisation (« au
      # poignet », « depuis la montre ») : les mêmes clés y portent d'autres phrases.
      - path: RunUpWatch
      # Only the hex/darken color math — the rest of Shared/ is widget/Live Activity plumbing
      # (RunActivityAttributes imports ActivityKit, which doesn't exist on watchOS).
      - path: RunUp/Shared/ColorHex.swift
      # La montre ne prend de `RunUp/Shared` que les fichiers dont elle a besoin, un par un —
      # le dossier entier y ferait entrer du code qui dépend de modèles absents de cette cible.
      - path: RunUp/Shared/DisplayFont.swift
      # La disposition de l'écran de course, choisie sur le téléphone et poussée ici. Le type est
      # partagé pour que les deux bouts du canal ne puissent pas diverger sur le format.
      - path: RunUp/Shared/WatchRunLayout.swift
      # Les tailles de l'écran de course, dérivées de la hauteur que le système donne. Partagé
      # pour que `WatchRunMetricsTests` puisse vérifier le budget vertical depuis la cible iOS —
      # la cible montre, elle, n'a pas de tests.
      - path: RunUp/Shared/WatchRunMetrics.swift
      # La mise en forme des durées. La montre en avait deux copies écrites à la main ; l'une
      # d'elles, celle du widget, avait raté la correction du « 95:00 ». Une seule règle pour les
      # trois cibles, et testée depuis la cible iOS.
      - path: RunUp/Shared/TimeFormat.swift
      # `TimeFormat` référence `Discipline` pour choisir entre allure et vitesse : sans ce
      # fichier, la montre ne compile pas.
      - path: RunUp/Shared/Discipline.swift

      # ─── LES RESSOURCES PARTAGÉES PASSENT PAR `sources:`, PAS PAR `resources:` ───────────────
      #
      # LA CLÉ `resources:` N'EXISTE PAS DANS XCODEGEN. Ces deux chemins étaient déclarés sous
      # une clé `resources:` au niveau de la cible, et cette clé n'est pas une clé de cible :
      # `Docs/ProjectSpec.md` § Target ne la liste pas, `Target.init(jsonDictionary:)` n'a aucune
      # branche pour elle, et `SourceGenerator.getAllSourceFiles` ne regarde que `target.sources`.
      # La valeur est donc jetée en silence — ni erreur, ni avertissement. C'est le ticket
      # XcodeGen #1645, ouvert et non corrigé à ce jour (XcodeGen 2.46.0).
      #
      # CE QUE ÇA COÛTAIT, MESURÉ DANS LE PAQUET CONSTRUIT. Sonde du workflow « Capture de la
      # montre » sur le commit 5cadd52 : `RunUpWatch.app` portait bien `fr.lproj`, `en.lproj` et
      # `es.lproj`, mais chacun ne contenait QUE `InfoPlist.strings` — aucun `Localizable.strings`
      # — et il n'y avait AUCUN fichier `.ttf` dans le paquet. Donc, pour tout le monde et depuis
      # le premier jour de la cible montre :
      #
      #   · la montre parlait français quelle que soit la langue du téléphone. Chaque
      #     `Text("Courir")` retombait sur sa CLÉ, qui est française et parfaitement lisible —
      #     c'est pour ça que rien ne se voyait ;
      #   · elle s'affichait dans la police système et pas en Inter, malgré les trois fichiers
      #     enregistrés dans son `UIAppFonts` ci-dessous. Un `UIAppFonts` qui nomme un fichier
      #     absent du paquet ne lève rien : SwiftUI retombe sur la police système en silence.
      #
      # POURQUOI PERSONNE NE L'A VU. Le build était vert — rien ne manquait à la compilation.
      # `check_fonts.py` était vert — il comparait l'`UIAppFonts` au code et aux noms PostScript
      # des fichiers, jamais à ce qui est LIVRÉ. Et les captures de la montre montraient un écran
      # français, qu'on prenait pour la capture française. Le commentaire qui vivait ici disait
      # même « sans lui, la montre restait entièrement en français » : la phrase était au passé,
      # alors que la cause n'avait jamais été corrigée.
      #
      # CE QUI ATTERRISSAIT QUAND MÊME n'y arrivait pas par cette clé : `RunUpWatch/Assets.xcassets`
      # et `RunUpWatch/InfoPlist.xcstrings` entrent par l'entrée `path: RunUpWatch` tout en haut,
      # qui les contient. D'où la confusion : la cible avait trois `.lproj`, donc elle avait l'air
      # trilingue. J'avais regardé le contenant, pas le contenu.
      #
      # `buildPhase: resources` est écrit explicitement plutôt que déduit de l'extension : c'est
      # la seconde approche documentée sur le même ticket, et elle dit ce qu'on veut au lieu de
      # l'espérer. `ci_scripts/check_spec.py` refuse désormais toute clé de cible inconnue, et
      # vérifie que les polices enregistrées et les traductions déclarées sont bien livrées.
      - path: RunUp/Resources/Fonts
        buildPhase: resources
        excludes:
          - "*.md"
          # Cette cible ne déclare que 3 fichiers dans son UIAppFonts, et ce que l'UIAppFonts
          # n'enregistre pas ne peut pas se charger : embarquer les 5 autres n'ajouterait que
          # ~750 Ko de poids mort au poignet.
          - "Inter-Light.ttf"
          - "Inter-Regular.ttf"
          - "Inter-Italic.ttf"
          - "DMMono-Regular.ttf"
          - "DMMono-Medium.ttf"
      # Le MÊME catalogue de chaînes que l'app iPhone. Le partager plutôt que d'en créer un second
      # évite d'avoir à traduire deux fois les libellés communs (KM, TEMPS, KCAL, EN PAUSE…).
      - path: RunUp/Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: RunUpWatch/Info.plist
      properties:
        CFBundleDisplayName: RunUp
        # Must track the iOS app's version pair exactly — App Store validation requires it.
        CFBundleShortVersionString: "3.4"
        CFBundleVersion: "14"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.hicsuntco.runup
        # Mêmes langues déclarées que l'app iPhone, sinon watchOS ne propose que le français.
        CFBundleLocalizations:
          - fr
          - en
          - es
        # Without the workout-processing background mode, watchOS suspends the app seconds after
        # the wrist drops — the HKWorkoutSession stops collecting mid-run.
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "RunUp lit ta fréquence cardiaque pendant la course pour l'afficher en direct au poignet."
        NSHealthUpdateUsageDescription: "RunUp enregistre ta course comme une vraie séance dans Santé — elle compte dans tes anneaux."
        NSLocationWhenInUseUsageDescription: "RunUp utilise ta position pour mesurer distance et allure pendant une course depuis la montre."
        UIAppFonts:
          - Inter-Medium.ttf
          - Inter-Bold.ttf
          - Inter-SemiBold.ttf
    entitlements:
      path: RunUpWatch/RunUpWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SW49TQ25NV
        TARGETED_DEVICE_FAMILY: "4"
        # Single 1024×1024 source icon, same as the RunUp target — Xcode generates every required
        # watch size at build/App Store processing time and auto-populates CFBundleIconName. Its
        # absence is exactly what the upload rejection (missing CFBundleIconName + "no icons found
        # for watch application") flagged.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # First test target in the project. Scoped deliberately at the ONE place where a silent
  # regression does real-world harm rather than chasing a coverage percentage: the plan engine
  # decides what a real person is told to run, and the audit found four progression defects there
  # (no deload weeks, a +115% long-run jump between blocks, an all-quality Spécifique block, an
  # uncapped tier inflating the taper). These tests encode the safety invariants those fixes
  # established, so a future refactor of the engine fails the build instead of quietly shipping an
  # injury-risk plan again.
  RunUpTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunUpTests
    dependencies:
      - target: RunUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup.tests
        GENERATE_INFOPLIST_FILE: YES

  # Les captures de la fiche App Store, prises par la machine sur un simulateur.
  #
  # CIBLE SÉPARÉE ET SURTOUT SCHÉMA SÉPARÉ (voir `schemes:` en bas de ce fichier). L'attacher au
  # schéma `RunUp` aurait fait tourner six lancements de simulateur à CHAQUE envoi sur TestFlight :
  # quelques minutes de plus par build, et surtout un test d'interface — la catégorie de test la
  # plus capricieuse qui soit — capable de bloquer une livraison parce qu'une animation a mis une
  # demi-seconde de trop. Les captures se demandent, elles ne s'imposent pas.
  # LA MONTRE A ENFIN UNE CIBLE QUI LA PILOTE.
  #
  # La chaîne sait la PHOTOGRAPHIER depuis le chantier 33 — on construit, on installe,
  # `simctl io screenshot`. Photographier n'est pas piloter : une image dit à quoi l'écran
  # ressemble, pas qu'on peut s'en servir. La montre était la seule partie du produit qu'aucun
  # test ne touchait, et c'est celle qui vient de passer des mois à parler français à tout le
  # monde.
  #
  # Le support de XCUITest sur watchOS existe depuis Xcode 12.5 et il est PARTIEL : pas
  # d'enregistrement, et des éléments qui n'entrent dans l'arbre d'accessibilité qu'après un
  # défilement. Les tests portent donc sur ce qui est visible à l'ouverture.
  #
  # `TEST_TARGET_NAME` désigne l'app que `XCUIApplication()` lance. Sans lui, la cible compile et
  # ne lance rien.
  RunUpWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: RunUpWatchUITests
    dependencies:
      - target: RunUpWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RunUpWatch

  RunUpUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunUpUITests
    dependencies:
      - target: RunUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hicsuntco.runup.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RunUp

# Le schéma des captures, à part.
#
# `xcodebuild test -scheme Captures` ne construit et ne lance QUE ce qu'il faut pour photographier
# l'app. Le schéma `RunUp`, lui, ne connaît que `RunUpTests` et continue de livrer sur TestFlight
# sans jamais démarrer un simulateur de plus.
schemes:
  # LA MONTRE A SON PROPRE SCHÉMA, et c'est ce qui permet de la PHOTOGRAPHIER.
  #
  # Aucune de ses vues n'avait jamais été capturée : il n'y a pas de cible de test d'interface
  # pour watchOS, et l'image livrée à Apple était faite à la main — elle montrait un bouton
  # pilule quand le code dessine un cercle depuis le 6 août 2026, et « COURIR » en capitales,
  # que la fonte d'affichage actuelle ne sait plus produire.
  #
  # Une capture de montre ne passe pas par un test : on construit, on installe sur un simulateur
  # watchOS, on lance, et `simctl io screenshot` photographie l'écran. Il faut donc un schéma
  # qui construise CETTE cible seule — `Captures` construit l'app iPhone, sur une autre
  # plateforme, et ne peut pas servir.
  #
  # Debug, comme `Captures`, et pour une raison plus faible mais réelle : c'est la configuration
  # dans laquelle l'app est éprouvée partout ailleurs, et une capture doit montrer ce qu'on
  # éprouve.
  Montre:
    build:
      targets:
        RunUpWatch: [run]

  # LE SCHÉMA DE TEST NE LISTE PAS `RunUpWatch` EN CIBLE DE BUILD, et c'est une précaution prise
  # sur un retour public plutôt que sur une supposition : lister l'app de la montre dans le
  # schéma de ses tests d'interface a empêché Xcode de créer le schéma de l'app elle-même, celui
  # dont la commande de build se sert. La dépendance déclarée sur la cible suffit à la faire
  # construire.
  MontreTests:
    build:
      targets:
        RunUpWatchUITests: [test]
    test:
      # Debug, comme partout ailleurs : c'est la configuration dans laquelle l'app est éprouvée.
      config: Debug
      targets:
        - RunUpWatchUITests
  Captures:
    build:
      targets:
        # `run` en plus de `test` : un test d'interface INSTALLE puis LANCE l'app, ce n'est pas
        # une cible qu'on se contente de compiler.
        RunUp: [run, test]
        RunUpUITests: [test]
    test:
      # Debug, et c'est la condition de tout : `CaptureSeed` vit sous `#if DEBUG`, donc une
      # construction Release ne contient pas le faux profil et photographierait l'écran
      # d'inscription.
      config: Debug
      targets:
        - RunUpUITests
